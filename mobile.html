<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.3.3">
<meta name="notes-name" content="WB-Notes">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Week Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Week Board</title>
<style>
  :root {
    --bg: #f4f5f7; --col: #ebecf0; --card: #fff; --text: #172b4d; --muted: #6b778c;
    --accent: #2f6fed; --today: #fff4d6; --border: #dfe1e6; --late: #fde8e8; --ok: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --col: #1e2126; --card: #2a2e35; --text: #e6e8eb; --muted: #8b95a3;
            --accent: #6a9bff; --today: #3a3220; --border: #343942; --late: #3b2226; --ok: #54c283; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  button { font: inherit; color: inherit; }
  header { flex: none; padding: calc(10px + env(safe-area-inset-top)) 14px 6px; display: flex; align-items: center; gap: 6px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .ib { flex: none; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .ib:active { background: var(--col); }
  #strip { flex: none; display: grid; grid-template-columns: repeat(var(--cols, 7), 1fr); gap: 5px; padding: 4px 10px 8px; }
  .dchip { border: 1px solid var(--border); border-radius: 12px; background: var(--col); padding: 6px 0 5px; text-align: center; cursor: pointer; min-width: 0; }
  .dchip .dw { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .dchip .dn { display: block; font-size: 17px; font-weight: 600; }
  .dchip .dc { display: block; min-height: 15px; font-size: 11px; color: var(--muted); }
  .dchip.we { opacity: .75; }
  .dchip.today { background: var(--today); }
  .dchip.sel { background: var(--accent); border-color: var(--accent); color: #fff; opacity: 1; }
  .dchip.sel .dw, .dchip.sel .dc { color: rgba(255,255,255,.85); }
  #dayhead { flex: none; padding: 2px 14px 6px; display: flex; align-items: baseline; gap: 8px; }
  #dayhead h2 { margin: 0; font-size: 18px; flex: 1; }
  #dayhead label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #dayhead input { width: 18px; height: 18px; }
  #err { flex: none; margin: 0 14px 6px; padding: 8px 10px; border-radius: 8px; background: var(--late); font-size: 14px; display: none; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px 12px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .card { display: flex; align-items: flex-start; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .card.done .t { text-decoration: line-through; color: var(--muted); }
  .card input[type=checkbox] { flex: none; width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--accent); }
  .card .body { flex: 1; min-width: 0; }
  .card.line { background: transparent; border-style: dashed; }
  .card .mark { flex: none; width: 24px; text-align: center; color: var(--muted); font-weight: 700; line-height: 1.4; }
  .card .t.hd { font-weight: 700; }
  .card .t { word-wrap: break-word; overflow-wrap: anywhere; }
  .card .n { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .chip { display: inline-block; margin-top: 6px; padding: 1px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; color: var(--muted); }
  #extras { flex: none; display: flex; gap: 8px; padding: 0 10px 6px; }
  #extras button { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #extras button b { font-weight: 700; }
  #extras button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #extras button.hot:not(.on) b { color: #d43b3b; }
  .sec { display: flex; align-items: baseline; gap: 8px; width: 100%; margin: 10px 0 6px; padding: 4px 4px; border: none; background: none; text-align: left; font-weight: 600; cursor: pointer; }
  .sec span { font-weight: 400; font-size: 12px; color: var(--muted); }
  .bulk { display: block; width: 100%; margin: 4px 0 6px; padding: 12px; border: 1px solid var(--accent); border-radius: 10px; background: none; color: var(--accent); font-weight: 600; cursor: pointer; }
  #addhint { flex: 0 0 100%; text-align: left; padding: 2px 4px 0; border: none; background: none; font-size: 13px; color: var(--accent); cursor: pointer; }
  #addhint[hidden] { display: none; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--border); font-size: 16px; }
  .srow small { display: block; color: var(--muted); font-size: 12px; }
  .srow select { font: inherit; font-size: 15px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .srow input[type=checkbox] { flex: none; width: 24px; height: 24px; accent-color: var(--accent); }
  .grp { margin-bottom: 8px; }
  .ghrow { display: flex; align-items: center; gap: 4px; }
  .ghrow .more { margin: 0; flex: none; }
  .gh { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 6px; border: none; background: none; text-align: left; font-weight: 600; cursor: pointer; }
  .gh .ar { flex: none; width: 30px; text-align: center; font-size: 26px; line-height: 1; color: var(--accent); transition: transform .15s; }
  .grp.shut .gh .ar { transform: rotate(-90deg); }
  .gh .gn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .gh .gc { flex: none; font-size: 12px; font-weight: 400; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .gbody { margin-left: 10px; padding-left: 8px; border-left: 2px solid var(--border); }
  .grp.shut .gbody { display: none; }
  .gadd { width: 100%; margin: 0 0 4px; font: inherit; font-size: 15px; padding: 9px 11px; border: 1px dashed var(--border); border-radius: 10px; background: transparent; color: var(--text); }
  .gaddrow { display: flex; gap: 6px; align-items: flex-start; }
  .gaddrow .gadd { flex: 1; min-width: 0; }
  .gtypewrap { position: relative; flex: none; width: 44px; height: 40px; border: 1px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: var(--text); }
  .gtglyph { pointer-events: none; }
  .gtype { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
  .gtypewrap:focus-within { border-style: solid; border-color: var(--accent); }
  .gaddbtn { flex: none; height: 40px; padding: 0 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .gaddbtn:disabled { background: var(--col); color: var(--muted); cursor: default; }
  .gadd:focus { outline: none; border-style: solid; border-color: var(--accent); background: var(--card); }
  .gtag { display: block; font-size: 12px; color: var(--muted); margin-bottom: 1px; overflow-wrap: anywhere; }
  .more { flex: none; width: 36px; height: 36px; margin: -6px -6px -6px 0; border: none; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 8px; }
  .more:active { background: var(--col); }
  .zopen { flex: none; width: 32px; height: 36px; margin: -6px 0 -6px 0; border: none; background: none; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 8px; }
  .zopen:active { background: var(--col); }
  .zbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .zbar button { border: 1px solid var(--border); background: var(--col); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .zbar .zc { border: none; background: none; padding: 2px 2px; font-weight: 400; font-size: 13px; color: var(--accent); }
  .zbar .zc.cur { color: var(--text); }
  .zadd { margin-top: 6px; }
  #unlockbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 14px 6px; padding: 6px 10px; border-radius: 10px; background: rgba(46,160,67,.14); border: 1px solid rgba(46,160,67,.45); font-size: 13px; }
  #unlockbar button { border: 1px solid rgba(46,160,67,.6); background: transparent; color: inherit; border-radius: 8px; padding: 3px 10px; font-weight: 600; cursor: pointer; }
  .dec { border-left: 4px solid #2ea043 !important; }
  .decmark { margin-right: 4px; }
  #addbar { flex: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
  #addbar input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); }
  #addbar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #addbar button { flex: none; padding: 0 16px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  /* bottom sheet */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 20; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); display: none; max-height: 85dvh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
  #sheet h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  #sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .sbtn { display: block; width: 100%; text-align: left; padding: 14px 12px; margin: 0; border: none; border-bottom: 1px solid var(--border); background: none; font-size: 16px; cursor: pointer; }
  .sbtn:active { background: var(--col); }
  .sbtn.danger { color: #d43b3b; }
  .sbtn.cancel { border-bottom: none; color: var(--muted); text-align: center; }
  #sheet textarea { width: 100%; min-height: 84px; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); resize: vertical; }
  #toast button { border: none; background: none; color: #9cc0ff; font-weight: 700; font-size: 14px; padding: 2px 4px; cursor: pointer; }
  #sheet .row { display: flex; gap: 8px; margin-top: 10px; }
  #sheet .row button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--col); font-weight: 600; cursor: pointer; }
  #sheet .row button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  #sheet input[type=date], #sheet input[type=time] { width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); margin-top: 8px; }
  #toast { display: none; align-items: center; gap: 12px; position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #172b4d; color: #fff; padding: 9px 14px; border-radius: 999px; font-size: 14px; z-index: 30; display: none; max-width: 90vw; }
</style>
</head>
<body>
<header>
  <button class="ib" id="prevW" aria-label="Previous week">‹</button>
  <h1 id="title">Week Board<small id="range"></small></h1>
  <button class="ib" id="nextW" aria-label="Next week">›</button>
  <button class="ib" id="today" aria-label="Go to today" title="Today">⌂</button>
  <button class="ib" id="reload" aria-label="Refresh">↻</button>
  <button class="ib" id="menu" aria-label="Menu">⋯</button>
</header>
<div id="strip"></div>
<div id="extras"></div>
<div id="dayhead"><h2 id="dayname"></h2><label id="doneLabel"><input type="checkbox" id="showDone"> Show done</label></div>
<div id="err"></div>
<div id="list"></div>
<form id="addbar" autocomplete="off">
  <button type="button" id="addhint" hidden></button>
  <input id="addin" type="text" placeholder="+ Add task" enterkeyhint="done" aria-label="Add task to this day" autocapitalize="sentences">
  <button type="submit">Add</button>
</form>
<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
"use strict";
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const mondayOf = (d) => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

// the week starts on Monday, or on Sunday when Week length is "7 days (Sun–Sat)"
let weekType = ["5", "7", "7s"].includes(store.get("m.span", "7")) ? store.get("m.span", "7") : "7";
let span = weekType === "5" ? 5 : 7;
const startOf = (d) => { if (weekType !== "7s") return mondayOf(d); const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); };
let weekStart = startOf(today());
let sel = key(today());
let showDone = store.get("m.showDone", "0") === "1";
let showLate = store.get("m.showLate", "1") === "1", showSoon = store.get("m.showSoon", "1") === "1";
const cache = {};                       // day key -> tasks, in outline order
const bullets = {};                     // day key -> bullets/headings of that day (candidates for groups)
const nest = {};                        // bullet id -> { todos: [...] }
const sect = {};                        // Inbox heading id -> every child, any type (a heading in the Inbox is a section)
const allOf = {};                       // list key -> every child of any type (the Inbox shows them all)
const typeOf = (n) => (n.data && n.data.layoutMode) || "bullets";
let mine = new Set(); try { mine = new Set(JSON.parse(store.get("m.groups", "[]"))); } catch (e) { /* none */ }   // groups added here, shown even while empty
const saveMine = () => store.set("m.groups", JSON.stringify([...mine].slice(-200)));
const NOTES = ((document.querySelector('meta[name="notes-name"]') || {}).content || "WB-Notes").trim().toLowerCase();
let mode = store.get("m.nested", "group");                // group | flatten | off
let shut = new Set(); try { shut = new Set(JSON.parse(store.get("m.shut", "[]"))); } catch (e) { /* none */ }
const saveShut = () => store.set("m.shut", JSON.stringify([...shut]));
let loadToken = 0;
let view = "day";                       // day | late | soon | inbox
let zoom = [];                          // opened bullets, outermost first: { id, name, up, day, from }; empty = the normal board
const zkids = {};                      // opened item id -> its children, any type
let inbox = null; try { const v = JSON.parse(store.get("m.inbox", "null")); if (v && v.id) inbox = { id: String(v.id), name: String(v.name || "Inbox") }; } catch (e) { /* none */ }
const ISO_DAY = /^\d{4}-\d{2}-\d{2}$/;
let extrasReady = false, extrasAt = 0;
const LATE_DAYS = 14, SOON_DAYS = 14;
const undoStack = [];

/* ---------- sharing settings between devices (optional, per device, off by default) ---------- */
let sync = store.get("m.sync", "0") === "1";
let applying = false, pushTimer = 0, syncAt = store.get("m.syncAt", "");
const SHARED_KEYS = new Set(["m.nested", "m.span", "m.showLate", "m.showSoon", "m.showDone", "m.inbox"]);
let inboxGone = false;                 // true only after "Remove" on this device, so a device without an Inbox never wipes the shared one
const sharedNow = () => { const o = { nested: mode, span: weekType, showLate, showSoon, showDone }; if (inbox) o.inbox = inbox; else if (inboxGone) o.inbox = null; return o; };
{ const rawSet = store.set; store.set = (k, v) => { rawSet(k, v); if (sync && !applying && SHARED_KEYS.has(k)) pushShared(); }; }
function pushShared(now) {
  clearTimeout(pushTimer);
  const go = async () => {
    try {
      const r = await fetch("/m/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: sharedNow() }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || `failed (${r.status})`);
      syncAt = j.updated || ""; store.set("m.syncAt", syncAt); if (!inbox) inboxGone = false;
    } catch (e) { toast("Couldn't share settings: " + e.message); }
  };
  if (now) return go();
  pushTimer = setTimeout(go, 600);
}
function applyShared(s) {
  applying = true;
  try {
    if (["group", "flatten", "off"].includes(s.nested)) { mode = s.nested; store.set("m.nested", mode); }
    if (["5", "7", "7s"].includes(s.span)) { weekType = s.span; span = weekType === "5" ? 5 : 7; store.set("m.span", weekType); weekStart = startOf(keyToDate(sel)); }
    for (const [k, mk] of [["showLate", "m.showLate"], ["showSoon", "m.showSoon"], ["showDone", "m.showDone"]]) {
      if (typeof s[k] === "boolean") { if (k === "showLate") showLate = s[k]; else if (k === "showSoon") showSoon = s[k]; else showDone = s[k]; store.set(mk, s[k] ? "1" : "0"); }
    }
    if (s.inbox === null) { inbox = null; store.set("m.inbox", "null"); }
    else if (s.inbox && s.inbox.id) { inbox = { id: String(s.inbox.id), name: String(s.inbox.name || "Inbox") }; store.set("m.inbox", JSON.stringify(inbox)); }
    if ((view === "late" && !showLate) || (view === "soon" && !showSoon) || (view === "inbox" && !inbox)) view = "day";
    $("showDone").checked = showDone;
  } finally { applying = false; }
}
// Fetch the shared settings; returns { enabled, settings, updated } or null when the server can't be reached.
async function fetchShared() { try { return await getJson("/m/settings"); } catch (e) { return null; } }
// Apply the shared settings if they changed since this device last saw them. Returns true when something was applied.
async function pullShared() {
  const j = await fetchShared();
  if (!j || !j.enabled || !j.settings || !j.updated || j.updated === syncAt) return false;
  applyShared(j.settings); syncAt = j.updated; store.set("m.syncAt", syncAt);
  return true;
}

/* ---------- editing formatted text (ported unchanged from the desktop board) ----------
   Text with tags (a date, a link, bold) is edited as its visible words; the tags stay where they are. */
const entityCache = {};
function decodeEntity(e) {
  return entityCache[e] || (entityCache[e] = new DOMParser().parseFromString(e, "text/html").body.textContent);
}
function tokenize(raw) {
  const out = [];
  for (const m of String(raw || "").matchAll(/<br\s*\/?>|<[^>]*>|&(?:#\d+|#x[0-9a-f]+|[a-z][a-z0-9]*);|[\s\S]/gi)) {
    const r = m[0];
    if (/^<br/i.test(r)) out.push({ raw: r, text: "\n" });
    else if (r.length > 1 && r[0] === "<") out.push({ raw: r, text: "" });
    else if (r.length > 1 && r[0] === "&") out.push({ raw: r, text: decodeEntity(r) });
    else out.push({ raw: r, text: r });
  }
  return out;
}
const visibleText = (raw) => tokenize(raw).map((t) => t.text).join("");
const escapeMarkup = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function applyEditCore(raw, next) {
  const toks = tokenize(raw);
  const old = toks.map((t) => t.text).join("");
  if (old === next) return raw;
  if (!toks.some((t) => t.raw !== t.text)) return next;
  let p = 0;
  while (p < old.length && p < next.length && old[p] === next[p]) p++;
  let s = 0;
  while (s < old.length - p && s < next.length - p && old[old.length - 1 - s] === next[next.length - 1 - s]) s++;
  const delStart = p, delEnd = old.length - s, insert = escapeMarkup(next.slice(p, next.length - s));
  const pureInsert = delStart === delEnd;
  let pos = 0, out = "", inserted = false;
  if (pureInsert && delStart === 0) { out = insert; inserted = true; }   // typing at the very start
  for (const t of toks) {
    if (!t.text.length) { out += t.raw; continue; }          // tags stay where they are
    const a = pos, b = pos + t.text.length;
    pos = b;
    if (!pureInsert && !inserted && a >= delStart) { out += insert; inserted = true; }   // replacing: new words go where the old ones were
    if (a >= delStart && b <= delEnd && !pureInsert) continue;   // a removed character
    out += t.raw;
    if (pureInsert && !inserted && b === delStart) { out += insert; inserted = true; }   // typing continues the formatting of the character before
  }
  if (!inserted) out += insert;
  return visibleText(out) === next ? out : escapeMarkup(next);   // safety net: never save something that reads differently

    sbtn(s, "🖥 Open the desktop page", () => { store.set("m.desktop", "1"); location.href = "/?desktop=1"; });
    sbtn(s, "Sign out", async () => { try { await fetch("/logout", { method: "POST" }); } catch (e) { /* leave anyway */ } location.href = "/login"; });
    sbtn(s, "Close", closeSheet, "cancel");
  });
}

/* ---------- adding (with date words: "Call dentist fri", "Report 11/5", "Pay rent in 3 days") ---------- */
const MONTH_NUM = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12,
  january: 1, february: 2, march: 3, april: 4, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
const WEEKDAY_NUM = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, weds: 3, wednesday: 3,
  thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6 };
function nextMonday(base) { return addDays(base, ((8 - base.getDay()) % 7) || 7); }
function realDate(y, m, d) { const x = new Date(y, m - 1, d); return x.getFullYear() === y && x.getMonth() === m - 1 && x.getDate() === d ? x : null; }
function upcoming(m, d, base) { const a = realDate(base.getFullYear(), m, d); if (a && a >= base) return a; return realDate(base.getFullYear() + 1, m, d); }
const MONTH_RE = "(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
const DATE_RULES = [
  [/\s(today)$/i, () => 0],
  [/\s(?:tomorrow|tmrw|tmr)$/i, () => 1],
  [/\sin\s+(\d{1,3})\s+(day|days|week|weeks)$/i, (m, base) => addDays(base, Number(m[1]) * (/^w/i.test(m[2]) ? 7 : 1))],
  [/\snext\s+week$/i, (m, base) => nextMonday(base)],
  [/\s(next\s+)?(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)$/i, (m, base) => {
    const wd = WEEKDAY_NUM[m[2].toLowerCase()];
    if (m[1]) return addDays(nextMonday(base), (wd + 6) % 7);
    return addDays(base, ((wd - base.getDay() + 7) % 7) || 7);
  }],
  [/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/, (m, base) => {
    const mo = Number(m[1]), d = Number(m[2]);
    if (m[3]) return realDate(m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]), mo, d);
    return upcoming(mo, d, base);
  }],
  [new RegExp("\\s" + MONTH_RE + "\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?$", "i"), (m, base) => {
    const mo = MONTH_NUM[m[1].toLowerCase()], d = Number(m[2]);
    return m[3] ? realDate(Number(m[3]), mo, d) : upcoming(mo, d, base);
  }],
  [new RegExp("\\s(\\d{1,2})(?:st|nd|rd|th)?\\s+" + MONTH_RE + "(?:,?\\s+(\\d{4}))?$", "i"), (m, base) => {
    const mo = MONTH_NUM[m[2].toLowerCase()], d = Number(m[1]);
    return m[3] ? realDate(Number(m[3]), mo, d) : upcoming(mo, d, base);
  }],
];
function parseDateWords(text, base) {
  const t = " " + text.trim();
  for (const [re, f] of DATE_RULES) {
    const m = t.match(re); if (!m) continue;
    let d = f(m, base); if (typeof d === "number") d = addDays(base, d);
    if (!d) continue;
    const name = t.slice(1, m.index).replace(/\s+(on|by|due)$/i, "").trim();
    if (!name) return null;
    return { name, k: key(d) };
  }
  return null;
}
let literal = false;                                                 // "add it here, as typed"
$("addin").addEventListener("input", () => {
  literal = false;
  const p = parseDateWords($("addin").value, today()), h = $("addhint");
  h.hidden = !p; if (p) h.textContent = `→ ${dayText(p.k)} · tap to add it ${view === "inbox" ? "to " + inbox.name : "here"} as typed instead`;
});
$("addhint").onclick = () => { literal = true; $("addhint").textContent = view === "inbox" ? "Will be added to " + inbox.name + " exactly as typed" : "Will be added to this day exactly as typed"; $("addin").focus(); };
$("addbar").onsubmit = async (e) => {
  e.preventDefault();
  const inp = $("addin"), base = view === "inbox" ? inbox.id : sel; let name = inp.value.trim(), target = base; if (!name) return;
  if (!literal) { const p = parseDateWords(name, today()); if (p) { name = p.name; target = p.k; } }
  inp.disabled = true;
  try {
    const res = await call("POST", "/nodes", { parent_id: target, name, layoutMode: "todo", position: "bottom" });
    const id = res && (res.item_id || res.id || (res.node && res.node.id));
    const node = { id: id || "tmp" + Date.now(), name, note: "", priority: 1e9, completedAt: null, data: { layoutMode: "todo" } };
    if (target in cache) cache[target].push(node);
    if (target in allOf) allOf[target].push(node);
    inp.value = ""; literal = false; $("addhint").hidden = true; err(""); draw();
    const l = $("list"); if (target === base) l.scrollTop = l.scrollHeight;
    const label = target === base ? `Added “${shortText(node)}”${view === "inbox" ? " to " + inbox.name : ""}` : `Added “${shortText(node)}” to ${ISO_DAY.test(target) ? dayText(target) : "another list"}`;
    if (id) pushUndo(label, async () => { await call("DELETE", `/nodes/${id}`); removeNode(id); });
    else toast(label);
    loadDay(target).then(draw).catch(() => {});
  } catch (x) { err(x.message); }
  inp.disabled = false; inp.focus();
};

/* ---------- navigation ---------- */
$("prevW").onclick = () => { zoom = []; view = "day"; weekStart = addDays(weekStart, -7); sel = key(weekStart); draw(); loadWeek(); };
$("nextW").onclick = () => { zoom = []; view = "day"; weekStart = addDays(weekStart, 7); sel = key(weekStart); draw(); loadWeek(); };
$("today").onclick = () => { zoom = []; view = "day"; weekStart = startOf(today()); sel = key(today()); draw(); loadWeek(); };
$("reload").onclick = () => { loadWeek(true); };
$("menu").onclick = openMainMenu;
$("showDone").onchange = (e) => { showDone = e.target.checked; store.set("m.showDone", showDone ? "1" : "0"); draw(); };
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && !$("sheet").style.display.includes("block") && document.activeElement !== $("addin")) {
    if (sync && await pullShared()) draw();                    // settings changed on another device
    loadWeek();
  }
});

// swipe the list left or right to change the day
let sx = 0, sy = 0, st = 0;
$("list").addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
$("list").addEventListener("touchend", (e) => {
  if (view !== "day") return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  const wk = weekKeys(), i = wk.indexOf(sel) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < wk.length) { sel = wk[i]; draw(); loadNest(sel).then(draw); }
  else { weekStart = addDays(weekStart, dx < 0 ? 7 : -7); sel = key(addDays(weekStart, dx < 0 ? 0 : span - 1)); draw(); loadWeek(); }
}, { passive: true });

draw();
// when settings are shared, take the server's copy first (waiting at most a moment) so the first load already uses it
(sync ? Promise.race([pullShared(), new Promise((r) => setTimeout(r, 2500))]).catch(() => {}) : Promise.resolve()).then(() => { draw(); loadWeek(); });
</script>
