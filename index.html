const SEARCH_LIMIT = 50;     // results fetched per page
const searchModal = document.getElementById("searchModal");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const searchInfo = document.getElementById("searchInfo");
const fCompleted = document.getElementById("fCompleted");
const fTodos = document.getElementById("fTodos");
const fNotes = document.getElementById("fNotes");
let searchActive = -1;       // highlighted result (for the arrow keys)
let searchTimer = null;
let searchToken = 0;         // lets a newer search cancel an older one
let searchTotal = 0, searchShown = 0, searchTerms = [], searchIndexTime = 0, searchCount = 0;

function getBool(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : v === "1"; } catch (e) { return def; } }
fCompleted.checked = getBool("sCompleted", true);
fTodos.checked = getBool("sTodos", false);

// GET a JSON answer from one of this server's own helper endpoints (/search, /item).
async function api(path) {
  const res = await fetch(path);
  if (res.status === 401) { location.href = "/login"; throw new Error("Signed out. Redirecting to the sign-in page…"); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) throw new Error((data && data.error) || `${path.split("?")[0]} failed (${res.status})`);
  return data;
}

// Splits text into plain and <mark>ed pieces (built as DOM nodes, so nothing is treated as HTML).
function highlight(text, terms) {
  const lower = text.toLowerCase();
  if (lower.length !== text.length) return [document.createTextNode(text)];
  const marked = new Array(text.length).fill(false);
  for (const t of terms) {
    let i = lower.indexOf(t);
    while (i !== -1) { for (let k = i; k < i + t.length; k++) marked[k] = true; i = lower.indexOf(t, i + t.length); }
  }
  const out = [];
  for (let i = 0; i < text.length;) {
    let j = i;
    while (j < text.length && marked[j] === marked[i]) j++;
    if (marked[i]) { const m = document.createElement("mark"); m.textContent = text.slice(i, j); out.push(m); }
    else out.push(document.createTextNode(text.slice(i, j)));
    i = j;
  }
  return out;
}

function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return "updated just now";
  const m = Math.round(s / 60);
  return m < 60 ? `updated ${m} min ago` : `updated ${Math.round(m / 60)} h ago`;
}

function resultEl(hit, terms, i) {
  const row = document.createElement("div");
  row.className = "sr"; row.dataset.i = i;
  const title = document.createElement("div");
  title.className = "st" + (hit.todo && hit.done ? " done" : "");
  if (hit.todo) title.append(hit.done ? "☑ " : "☐ ");
  title.append(...highlight(hit.name || "(empty)", terms));
  const path = document.createElement("div");
  path.className = "sp"; path.textContent = hit.path.join(" › ") || "Top level";
  row.append(title, path);
  if (!hit.nameHit && hit.snippet) {                       // matched in the note: show where
    const d = document.createElement("div");
    d.className = "sp"; d.append("Note: ", ...highlight(hit.snippet, terms));
    row.append(d);
  }
  row.addEventListener("click", () => openItem(hit.id));
  return row;
}

function setActive(i, scroll = true) {
  searchActive = i;
  searchResults.querySelectorAll(".sr").forEach((el, k) => el.classList.toggle("active", k === i));
  if (scroll && i >= 0) {
    const el = searchResults.querySelector(`.sr[data-i="${i}"]`);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }
}

function searchStatus(note) {
  const age = "index " + ago(searchIndexTime).replace("updated ", "");
  let s = searchTerms.length
    ? `${searchTotal} match${searchTotal === 1 ? "" : "es"}${searchShown < searchTotal ? `, showing ${searchShown}` : ""} · ${age}`
    : age[0].toUpperCase() + age.slice(1);
  if (note) s += " · " + note;
  searchInfo.textContent = s;
}

function searchMessage(text) {
  searchResults.innerHTML = "";
  const d = document.createElement("div");
  d.className = "hint"; d.textContent = text;
  searchResults.appendChild(d);
}

// Asks the server for a page of matches. A fresh search starts at the top; "Show more" adds the next page.
async function doSearch(more, refresh) {
  const token = ++searchToken;
  const offset = more ? searchShown : 0;
  const params = new URLSearchParams({
    q: searchInput.value, offset: String(offset), limit: String(SEARCH_LIMIT),
    done: fCompleted.checked ? "1" : "0", todos: fTodos.checked ? "1" : "0", notes: fNotes.checked ? "1" : "0",
  });
  if (refresh) params.set("refresh", "1");
  if (!searchCount) { searchMessage("Indexing your outline…"); searchInfo.textContent = ""; }
  let r;
  try { r = await api("/search?" + params); }
  catch (e) {
    if (token !== searchToken) return;
    searchMessage("Couldn't search your outline: " + e.message); searchInfo.textContent = "";
    return;
  }
  if (token !== searchToken) return;
  searchTerms = r.terms; searchTotal = r.total; searchIndexTime = r.indexTime; searchCount = r.count;
  const note = refresh && r.throttled ? "WorkFlowy allows one refresh a minute" : "";
  if (!r.terms.length) {
    searchShown = 0; searchStatus(note);
    searchMessage(`Type to search ${r.count.toLocaleString()} items. Use "quotes" for an exact phrase and -word to leave something out.`);
    return;
  }
  if (!r.total) { searchShown = 0; searchStatus(note); searchMessage("No matches."); return; }
  if (more) searchResults.querySelector(".sr-more")?.remove(); else searchResults.innerHTML = "";
  r.hits.forEach((h, i) => searchResults.appendChild(resultEl(h, r.terms, offset + i)));
  searchShown = offset + r.hits.length;
  if (searchShown < searchTotal) {
    const b = document.createElement("button");
    b.className = "sr-more";
    b.textContent = `Show ${Math.min(SEARCH_LIMIT, searchTotal - searchShown)} more (${searchTotal - searchShown} left)`;
    b.onclick = () => { b.disabled = true; doSearch(true); };
    searchResults.appendChild(b);
  }
  if (!more) setActive(0, false);
  searchStatus(note);
}

function openSearch() {
  searchModal.hidden = false;
  searchInput.focus(); searchInput.select();
  doSearch();
}
function closeSearch() { searchModal.hidden = true; closeItem(true); }

// ---- Item editor: a search result opens over the list, inside the search window ----
async function openItem(id) {
  let r;
  try { r = await api("/item?id=" + encodeURIComponent(id)); } catch (e) { showError(e.message); return; }
  viewItem = id; addingFor = null;
  itemNodes = [r.item]; itemPath = r.path;
  document.getElementById("listPane").hidden = true;
  document.getElementById("itemPane").hidden = false;
  updateViewBar();
  renderPage();
  itemTree.scrollTop = 0;
}
// Re-reads the open item from the server (after an edit, or with refresh = a fresh download of your outline).
async function reloadItem(refresh) {
  if (!viewItem) return;
  try {
    const r = await api("/item?id=" + encodeURIComponent(viewItem) + (refresh ? "&refresh=1" : ""));
    itemNodes = [r.item]; itemPath = r.path;
    updateViewBar(); renderPage();
  } catch (e) {
    if (/not found/.test(e.message)) closeItem(); else showError(e.message);
  }
}
// Back to the results list (quiet = the window is closing).
function closeItem(quiet) {
  if (!viewItem) return;
  viewItem = null; addingFor = null; itemNodes = [];
  document.getElementById("itemPane").hidden = true;
  document.getElementById("listPane").hidden = false;
  if (!quiet) searchInput.focus();

}
function updateViewBar() {
  const bar = document.getElementById("viewBar");
  bar.innerHTML = "";

}

searchInput.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(), 150); });

// Update check: the server looks at GitHub (at most every 6 hours) and tells us the newest version.
function newer(a, b) {      // is version a newer than b?
  const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
  return false;
}
(async () => {
  try {
    const mine = document.querySelector('meta[name="version"]').content;
    const r = await fetch("/update-check");
    if (!r.ok) return;
    const info = await r.json();
    if (!info.latest || !newer(info.latest, mine)) return;
    const a = document.createElement("a");
    a.textContent = `⬆ v${info.latest} available`;
    a.title = `You have v${mine}. Download the new files from GitHub, replace server.js and index.html, and restart.`;
    if (info.url) { a.href = info.url; a.target = "_blank"; a.rel = "noopener"; }
    document.getElementById("ver").append(" · ", a);
  } catch (e) { /* no network or no answer: stay quiet */ }
})();

document.getElementById("searchBtn").onclick = openSearch;
document.getElementById("searchClose").onclick = closeSearch;
searchModal.addEventListener("click", (e) => { if (e.target === searchModal) closeSearch(); });
document.getElementById("searchRefresh").onclick = async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true; searchInfo.textContent = "Refreshing…";
  await doSearch(false, true);
  btn.disabled = false;
};
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
  else if (e.key === "Escape" && !settingsPop.hidden) { setSettingsOpen(false); settingsBtn.focus(); }
  else if (e.key === "Escape" && !searchModal.hidden) { if (viewItem) closeItem(); else closeSearch(); }
});

document.getElementById("notesEdit").onclick = changeNotesName;
applyNotesLabels();

loadWeek();
loadPage();
</script>
</body>
</html>
