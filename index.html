  scroll.className = "bring-list"; scroll.dataset.s = "bring";

  const late = [];
  for (const k of planPastKeys()) for (const n of cache[k] || []) if (!n.completedAt) late.push({ n, k });
  const lh = document.createElement("div");
  lh.className = "bgh";
  const lt = document.createElement("span");
  lt.textContent = `Past due (${late.length})` + (planLoading ? " · loading…" : "");
  lh.appendChild(lt);
  if (late.length) {
    const all = document.createElement("button");
    all.className = "mini"; all.textContent = "Add all…";
    all.onclick = () => openRoll({ title: `Bring past-due tasks to ${dayLabel(planDay)}`, items: late, dest: planDay });
    lh.appendChild(all);
  }
  scroll.appendChild(lh);
  if (!late.length && !planLoading) scroll.insertAdjacentHTML("beforeend", '<div class="empty">Nothing past due.</div>');
  for (const it of late) scroll.appendChild(planRow(it.n, it.k, "Add"));

  for (const k of planAheadKeys()) {
    const open = (cache[k] || []).filter((n) => !n.completedAt);
    const gh = document.createElement("div");
    gh.className = "bgh";
    gh.textContent = `${dayLabel(k)} (${open.length})`;
    scroll.appendChild(gh);
    if (!open.length) scroll.insertAdjacentHTML("beforeend", '<div class="empty">Nothing planned.</div>');
    for (const n of open) scroll.appendChild(planRow(n, k, "Add"));
  }
  right.appendChild(scroll);

  planEl.append(left, right);
  planEl.querySelectorAll(".tasks, .bring-list").forEach((el) => { if (keep[el.dataset.s]) el.scrollTop = keep[el.dataset.s]; });
}

const limitInput = document.getElementById("optLimit");
limitInput.value = String(planLimit);
limitInput.onchange = () => {
  const v = Math.max(0, Math.min(99, Math.floor(Number(limitInput.value) || 0)));
  planLimit = v; limitInput.value = String(v);
  try { localStorage.setItem("planLimit", String(v)); } catch (e) {}
  renderPlan();
};

// Esc closes the Done and move-forward windows.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!reportsPop.hidden) { setReportsOpen(false); reportsBtn.focus(); return; }
  if (!rollModal.hidden) closeRoll();
  else if (!doneModal.hidden) closeDone();
});

/* ---------- The Daily page and the notes box are one panel ---------- */
const outliner = document.getElementById("outliner");
const composerBar = document.getElementById("composerBar");
function setComposer(open, focus) {
  outliner.classList.toggle("composer-closed", !open);
  composerBar.setAttribute("aria-expanded", open ? "true" : "false");
  document.getElementById("cCar").textContent = open ? "▾" : "▸";
  composerBar.title = open ? "Hide the notes box" : "Show the notes box";
  setPref("composerOpen", open);
  updateComposerLabel();
  if (open && focus) outline.focus();
}
composerBar.onclick = () => setComposer(outliner.classList.contains("composer-closed"), true);
setComposer(getBool("composerOpen", true), false);

// The "⋯" menu in the header (rename the notes bullet, move notes in).
const pageMore = document.getElementById("pageMore");
const pageMenu = document.getElementById("pageMenu");
function setPageMenu(on) {
  pageMenu.hidden = !on;
  pageMore.setAttribute("aria-expanded", on ? "true" : "false");
  if (!on) return;
  const r = pageMore.getBoundingClientRect(), w = pageMenu.offsetWidth, h = pageMenu.offsetHeight;
  pageMenu.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  pageMenu.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
}
pageMore.onclick = (e) => { e.stopPropagation(); setPageMenu(pageMenu.hidden); };
pageMenu.addEventListener("click", (e) => { e.stopPropagation(); if (e.target.closest("button")) setPageMenu(false); });
document.addEventListener("click", () => { if (!pageMenu.hidden) setPageMenu(false); });
window.addEventListener("scroll", () => { if (!pageMenu.hidden) setPageMenu(false); }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !pageMenu.hidden) { setPageMenu(false); pageMore.focus(); e.stopPropagation(); } }, true);

document.getElementById("notesEdit").onclick = changeNotesName;
applyNotesLabels();

loadWeek();
loadPage();
</script>
</body>
