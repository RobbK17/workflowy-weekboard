<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<title>Workflowy Week Board</title>
<style>
  :root {
    --bg: #f4f5f7; --col: #ebecf0; --card: #fff; --text: #172b4d; --muted: #6b778c;
    --accent: #2f6fed; --today: #fff4d6; --border: #dfe1e6; --late: #fde8e8; --soon: #e3edff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --col: #1e2126; --card: #2a2e35; --text: #e6e8eb; --muted: #8b95a3;
            --accent: #6a9bff; --today: #3a3220; --border: #343942; --late: #3b2226; --soon: #202c42; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; flex: 1; min-width: 200px; }
  header h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; white-space: nowrap; }
  .opts { display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
  .opts label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  button { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg.mini button { padding: 2px 8px; font-size: 12px; }
  .rng { margin: 0 4px 8px; }
  #error { flex: none; display: none; margin: 0 16px 8px; padding: 8px 12px; border-radius: 6px;
           background: #fde8e8; color: #8a1c1c; }

  /* Main area: day columns on the left (scroll sideways), sidebar fixed on the far right. */
  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 16px 16px; }
  #board { flex: 1; min-width: 0; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
  #side { flex: 0 0 300px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #extras { display: flex; flex-direction: column; gap: 10px; }
  #extras:empty { display: none; }
  .panel { flex: none; background: var(--col); border-radius: 8px; padding: 10px; }
  .panel h3 { font-size: 13px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .panel h3 span { color: var(--muted); font-weight: 400; }

  /* Day columns: header (title + add box) stays put, tasks scroll underneath. */
  .col { flex: 1 0 220px; display: flex; flex-direction: column; max-height: 100%;
         background: var(--col); border-radius: 8px; padding: 8px; min-height: 140px; }
  #side .col { flex: none; width: 100%; max-height: 34vh; min-height: 0; }
  .colhead { flex: none; padding-bottom: 4px; }
  .tasks { flex: 1; min-height: 0; overflow-y: auto; padding-top: 4px; }
  .col.today { background: var(--today); }
  .col.late { background: var(--late); }
  .col.soon { background: var(--soon); }
  .col.over { outline: 2px dashed var(--accent); }
  .col h2 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }
  .col h2 span { color: var(--muted); font-weight: 400; }
  .col .sub { font-size: 12px; color: var(--muted); margin: -4px 4px 8px; }
  .card { display: flex; gap: 8px; align-items: flex-start; background: var(--card); border-radius: 6px;
          padding: 8px; margin-bottom: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); cursor: grab; }
  .card.done .txt { text-decoration: line-through; color: var(--muted); }
  .card.dragging { opacity: .4; }
  .card input[type=checkbox] { margin-top: 3px; }
  .txt { flex: 1; word-break: break-word; }
  .note, .badge { display: block; font-size: 12px; color: var(--muted); }
  .del { border: none; background: none; color: var(--muted); padding: 0 4px; opacity: 0; }
  .card:hover .del, .card:focus-within .del { opacity: 1; }
  @media (hover: none) { .del { opacity: 1; } }
  .add { display: block; width: 100%; padding: 7px 8px; border: 1px dashed var(--border); border-radius: 6px;
         background: transparent; color: var(--text); font: inherit; }
  .empty { color: var(--muted); font-size: 12px; padding: 2px 4px 8px; }

  /* Calendar */
  .calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .calhead button { padding: 2px 9px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .calgrid .dow { font-size: 11px; color: var(--muted); padding: 2px 0; }
  .calgrid .day { position: relative; border: none; background: transparent; padding: 5px 0; font-size: 12px; border-radius: 6px; }
  .calgrid .day:hover { background: var(--card); }
  .calgrid .day.other { color: var(--muted); opacity: .6; }
  .calgrid .day.inwin { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .calgrid .day.istoday { font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
  .calgrid .day i { position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
                    border-radius: 50%; background: var(--accent); }

  /* Outliner */
  #outline { display: block; width: 100%; min-height: 180px; resize: vertical; padding: 8px; border-radius: 6px;
             border: 1px solid var(--border); background: var(--card); color: var(--text);
             font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; }
  .ver { flex: none; font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0 0; }
  .outbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }

  @media (max-width: 820px) {
    #main { flex-direction: column; overflow-y: auto; }
    #board { flex: none; height: 75vh; height: 75dvh; }
    #side { flex: none; width: 100%; max-height: none; overflow: visible; }
    #side .col { max-height: 40vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Workflowy Week Board <small id="range"></small></h1>
  <div class="opts">
    <label><input type="checkbox" id="optHide"> Hide completed</label>
    <label><input type="checkbox" id="optLate"> Past due</label>
    <label><input type="checkbox" id="optSoon"> Upcoming</label>
  </div>
  <div class="seg" id="seg" title="Days to show">
    <button data-span="3">3</button><button data-span="5">5</button><button data-span="7">7</button>
  </div>
  <button id="prev">&larr;</button>
  <button id="today">This week</button>
  <button id="next">&rarr;</button>
  <button id="refresh" title="Reload">&#8635;</button>
</header>
<div id="error"></div>
<div id="main">
  <div id="board"></div>
  <aside id="side">
    <section class="panel" id="cal"></section>
    <div id="extras"></div>
    <section class="panel" id="outliner">
      <h3>Outline <span id="outTitle">saves to Today</span></h3>
      <textarea id="outline" spellcheck="true"
        placeholder="- Type bullets here&#10;  - Tab indents, Shift+Tab outdents&#10;- [ ] Start a line with [ ] for a todo&#10;&#10;Ctrl+Enter saves to today's page"></textarea>
      <div class="outbar"><button id="outSave">Save to today</button><span id="outStatus"></span></div>
    </section>
    <div class="ver">Workflowy Week Board v1.0.0</div>
  </aside>
</div>

<script>
const API = "/api/v1";
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MAX_MONTHS_BACK = 60;  // Past due "All" looks back at most this many months (5 years)
const LOOKAHEAD = 14;    // Upcoming scans this many days past the visible days (or past today)
const MAX_PARALLEL = 6;  // limit simultaneous requests to WorkFlowy

const cache = {};        // dateKey -> sorted node array

function getPref(k) { try { return localStorage.getItem(k) === "1"; } catch (e) { return false; } }
function setPref(k, v) { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} }
const prefs = { hideDone: getPref("hideDone"), showLate: getPref("showLate"), showSoon: getPref("showSoon") };

// Past due range: "1".."4" weeks back, or "all". Default is 2 weeks.
let lateRange = loadLateRange();
let loadingExtras = false;   // true while Past due / Upcoming days are still being fetched
let loadToken = 0;           // lets a newer load cancel an older one
const monthInfo = {};        // "YYYY-MM" -> does that calendar month exist? (used by "All")
function loadLateRange() {
  try { const v = localStorage.getItem("lateRange"); if (["all", "1", "2", "3", "4"].includes(v)) return v; } catch (e) {}
  return "2";
}

// span = days shown. 7 = Mon-Sun, 5 = Mon-Fri, 3 = today + next 2 days.
let span = loadSpan();
let weekStart = baseStart();               // Monday-based; change startOfWeek to use Sunday
let calMonth = firstOfMonth(weekStart);    // month shown in the sidebar calendar

function loadSpan() {
  try { const s = Number(localStorage.getItem("span")); if ([3, 5, 7].includes(s)) return s; } catch (e) {}
  return 5;
}
function baseStart() {
  const now = new Date();
  return span === 3 ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : startOfWeek(now);
}
function step() { return span === 3 ? 3 : 7; }   // arrows: 3-day mode pages by 3 days, others by a week

function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (x.getDay() + 6) % 7;       // days since Monday
  x.setDate(x.getDate() - diff);
  return x;
}
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function key(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function keyToDate(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function todayDate() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function plain(html) {
  return new DOMParser().parseFromString(html || "", "text/html").body.textContent;
}
function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg; el.style.display = msg ? "block" : "none";
}

async function call(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 404 && method === "GET") return null;   // day not created yet = empty column
  if (!res.ok) throw new Error(`${method} ${path} failed (${res.status}): ${await res.text()}`);
  return res.json();
}

async function loadDay(k) {
  const data = await call("GET", `/nodes?parent_id=${k}`);
  const nodes = data && data.nodes ? data.nodes : [];
  // Tasks only: skip plain bullets, headers, quotes and code blocks (anything not layoutMode "todo").
  const tasks = nodes.filter((n) => n.data && n.data.layoutMode === "todo");
  cache[k] = tasks.sort((a, b) => a.priority - b.priority);
}

// Loads many days with a small worker pool. Returns the first error message, if any.
async function loadMany(keys) {
  const queue = [...keys];
  let firstError = "";
  const worker = async () => {
    while (queue.length) {
      try { await loadDay(queue.shift()); } catch (e) { if (!firstError) firstError = e.message; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(MAX_PARALLEL, queue.length) }, worker));
  return firstError;
}

function weekDays() {
  return [...Array(span)].map((_, i) => addDays(weekStart, i));
}

// Day keys for the Past due and Upcoming panels. Both are relative to the days on screen:
// Past due = days before the first visible day, Upcoming = days after the last visible day.
function extraKeys() {
  const days = weekDays();
  const first = days[0], last = days[days.length - 1];
  const late = [], soon = [];
  if (prefs.showLate) {
    if (lateRange === "all") {
      // Only scan months that actually exist in your calendar (found by discoverMonths).
      for (let m = MAX_MONTHS_BACK - 1; m >= 0; m--) {          // oldest month first
        const m1 = new Date(first.getFullYear(), first.getMonth() - m, 1);
        if (!monthInfo[key(m1).slice(0, 7)]) continue;
        const dim = new Date(m1.getFullYear(), m1.getMonth() + 1, 0).getDate();
        for (let day = 1; day <= dim; day++) {
          const d = new Date(m1.getFullYear(), m1.getMonth(), day);
          if (d < first) late.push(key(d));
        }
      }
    } else {
      for (let i = Number(lateRange) * 7; i >= 1; i--) late.push(key(addDays(first, -i)));   // oldest first
    }
  }
  if (prefs.showSoon) {
    for (let i = 1; i <= LOOKAHEAD; i++) soon.push(key(addDays(last, i)));
  }
  return { late, soon };
}

// Finds which calendar months exist (one cheap request per month) so "All" skips empty ones.
async function discoverMonths(force) {
  const anchor = weekDays()[0];            // months are counted back from the first day on screen
  const todo = [];
  for (let i = 0; i < MAX_MONTHS_BACK; i++) {
    const mk = key(new Date(anchor.getFullYear(), anchor.getMonth() - i, 1)).slice(0, 7);
    if (force || !(mk in monthInfo)) todo.push(mk);
  }
  let firstError = "";
  const worker = async () => {
    while (todo.length) {
      const mk = todo.shift();
      try { monthInfo[mk] = (await call("GET", `/nodes?parent_id=${mk}`)) !== null; }
      catch (e) { if (!firstError) firstError = e.message; }
    }
  };
  await Promise.all(Array.from({ length: MAX_PARALLEL }, worker));
  return firstError;
}

// The visible days load first so the board appears quickly; Past due / Upcoming fill in after.
// force = true re-reads everything (the reload button); otherwise Past due days already loaded are reused.
async function loadWeek(force = false) {
  showError("");
  const token = ++loadToken;
  const err1 = await loadMany(weekDays().map(key));
  if (token !== loadToken) return;
  if (err1) showError(err1);
  loadingExtras = prefs.showLate || prefs.showSoon;
  render();
  if (!loadingExtras) return;

  let err2 = "";
  if (prefs.showLate && lateRange === "all") err2 = await discoverMonths(force);
  if (token !== loadToken) return;
  const { late, soon } = extraKeys();
  const err3 = await loadMany([...late.filter((k) => force || !(k in cache)), ...soon]);
  if (token !== loadToken) return;
  loadingExtras = false;
  if (err2 || err3) showError(err2 || err3);
  render();
}

function collect(keys, onlyOpen) {
  const out = [];
  for (const k of keys) {
    for (const n of cache[k] || []) {
      if ((onlyOpen || prefs.hideDone) && n.completedAt) continue;
      out.push({ n, k });
    }
  }
  return out;
}

function render() {
  const days = weekDays();
  const fmt = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const last = days[days.length - 1];
  document.getElementById("range").textContent = `${fmt(days[0])} – ${fmt(last)}, ${last.getFullYear()}`;
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", Number(b.dataset.span) === span));
  document.getElementById("outTitle").textContent = "saves to Today, " + fmt(new Date());

  const board = document.getElementById("board");
  board.innerHTML = "";
  const todayKey = key(new Date());
  const extra = extraKeys();

  for (const d of days) {
    const k = key(d);
    const col = document.createElement("div");
    col.className = "col" + (k === todayKey ? " today" : "");
    col.dataset.key = k;

    const items = cache[k] || [];
    const shown = prefs.hideDone ? items.filter((n) => !n.completedAt) : items;
    const open = items.filter((n) => !n.completedAt).length;

    // Header (day title + add box) stays fixed; only the task list below it scrolls.
    const head = document.createElement("div");
    head.className = "colhead";
    head.innerHTML = `<h2>${DAY_NAMES[d.getDay()]} ${d.getDate()}<span>${open} open</span></h2>`;
    const list = document.createElement("div");
    list.className = "tasks";
    if (!shown.length) {
      list.insertAdjacentHTML("beforeend",
        `<div class="empty">${items.length ? "All done" : "Nothing yet"}</div>`);
    }
    for (const n of shown) list.appendChild(card(n, k, false));

    const add = document.createElement("input");
    add.className = "add"; add.placeholder = "+ Add task"; add.enterKeyHint = "done";
    add.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !add.value.trim()) return;
      const name = add.value.trim(); add.value = "";
      await act(async () => {
        await call("POST", "/nodes", { parent_id: k, name, layoutMode: "todo", position: "bottom" });
        await loadDay(k);
      });
    });
    head.appendChild(add);
    col.append(head, list);

    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault(); col.classList.remove("over");
      const { id, from } = JSON.parse(e.dataTransfer.getData("text/plain") || "{}");
      if (!id || from === k) return;
      await act(async () => {
        await call("POST", `/nodes/${id}/move`, { parent_id: k, position: "bottom" });
        await Promise.all([loadDay(from), loadDay(k)]);
      });
    });

    board.appendChild(col);
  }

  // Sidebar: calendar, then Past due / Upcoming (when turned on). The outliner below is static.
  renderCal();
  const extras = document.getElementById("extras");
  extras.innerHTML = "";
  if (prefs.showLate) {
    const sub = lateRange === "all" ? "All open tasks before this view"
      : `Open tasks from the ${lateRange} ${lateRange === "1" ? "week" : "weeks"} before this view`;
    extras.appendChild(extraColumn("Past due", sub, collect(extra.late, true), "late",
      loadingExtras ? "Loading…" : "Nothing past due"));
  }
  if (prefs.showSoon) {
    extras.appendChild(extraColumn("Upcoming", `Tasks in the next ${LOOKAHEAD} days after this view`,
      collect(extra.soon, false), "soon", loadingExtras ? "Loading…" : "Nothing upcoming"));
  }
}

// Panel for tasks from days outside the visible range. Cards show their date;
// they can be checked off, edited, deleted, or dragged onto a day column to reschedule.
function extraColumn(title, sub, items, cls, emptyText) {
  const col = document.createElement("div");
  col.className = "col " + cls;
  const open = items.filter(({ n }) => !n.completedAt).length;
  const head = document.createElement("div");
  head.className = "colhead";
  head.innerHTML = `<h2>${title}<span>${open} open</span></h2><div class="sub">${sub}</div>`;
  if (cls === "late") {
    // How far back Past due looks: All, or 1-4 weeks.
    const seg = document.createElement("div");
    seg.className = "seg mini rng";
    seg.title = "How far back to look";
    seg.innerHTML = [["all", "All"], ["1", "1w"], ["2", "2w"], ["3", "3w"], ["4", "4w"]]
      .map(([v, label]) => `<button data-range="${v}" class="${lateRange === v ? "on" : ""}">${label}</button>`).join("");
    head.appendChild(seg);
  }
  const list = document.createElement("div");
  list.className = "tasks";
  if (!items.length) list.insertAdjacentHTML("beforeend", `<div class="empty">${emptyText}</div>`);
  for (const { n, k } of items) list.appendChild(card(n, k, true));
  col.append(head, list);
  return col;
}

function card(n, k, showDate) {
  const el = document.createElement("div");
  el.className = "card" + (n.completedAt ? " done" : "");
  el.draggable = true;
  el.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", JSON.stringify({ id: n.id, from: k }));
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = !!n.completedAt;
  cb.addEventListener("change", () => act(async () => {
    await call("POST", `/nodes/${n.id}/${cb.checked ? "complete" : "uncomplete"}`);
    await loadDay(k);
  }));

  const txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = plain(n.name);
  if (showDate) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = keyToDate(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    txt.appendChild(badge);
  }
  if (n.note) {
    const note = document.createElement("span");
    note.className = "note"; note.textContent = plain(n.note);
    txt.appendChild(note);
  }
  txt.title = "Double-click to edit";
  txt.addEventListener("dblclick", () => {
    const current = plain(n.name);
    const next = prompt("Edit task", current);
    if (next === null || next.trim() === "" || next === current) return;
    act(async () => { await call("POST", `/nodes/${n.id}`, { name: next.trim() }); await loadDay(k); });
  });

  const del = document.createElement("button");
  del.className = "del"; del.textContent = "✕"; del.title = "Delete";
  del.addEventListener("click", () => {
    if (!confirm("Delete this task permanently?")) return;
    act(async () => { await call("DELETE", `/nodes/${n.id}`); await loadDay(k); });
  });

  el.append(cb, txt, del);
  return el;
}

async function act(fn) {
  showError("");
  try { await fn(); } catch (e) { showError(e.message); }
  render();
}

/* ---------- Calendar ---------- */

function renderCal() {
  const el = document.getElementById("cal");
  const inWindow = new Set(weekDays().map(key));
  const todayK = key(new Date());
  const label = calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const gridStart = addDays(calMonth, -((calMonth.getDay() + 6) % 7));   // Monday-first grid
  let html = `<div class="calhead"><button data-cal="-1" title="Previous month">&lsaquo;</button>` +
             `<strong>${label}</strong><button data-cal="1" title="Next month">&rsaquo;</button></div><div class="calgrid">`;
  for (const w of ["M", "T", "W", "T", "F", "S", "S"]) html += `<div class="dow">${w}</div>`;
  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i), k = key(d);
    const cls = ["day"];
    if (d.getMonth() !== calMonth.getMonth()) cls.push("other");
    if (inWindow.has(k)) cls.push("inwin");
    if (k === todayK) cls.push("istoday");
    const hasOpen = (cache[k] || []).some((n) => !n.completedAt);   // dot only for days already loaded
    html += `<button class="${cls.join(" ")}" data-key="${k}">${d.getDate()}${hasOpen ? "<i></i>" : ""}</button>`;
  }
  el.innerHTML = html + "</div>";
}

document.getElementById("cal").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.cal) {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(btn.dataset.cal), 1);
    renderCal();
  } else if (btn.dataset.key) {
    const d = keyToDate(btn.dataset.key);
    weekStart = span === 3 ? d : startOfWeek(d);   // jump the board to the week (or 3 days) containing it
    calMonth = firstOfMonth(d);
    loadWeek();
  }
});

/* ---------- Outliner (saves to today's daily page) ---------- */

const outline = document.getElementById("outline");
const outSave = document.getElementById("outSave");
const outStatus = document.getElementById("outStatus");
let saving = false;

function saveDraft() { try { localStorage.setItem("outlineDraft", outline.value); } catch (e) {} }
try { outline.value = localStorage.getItem("outlineDraft") || ""; } catch (e) {}
outline.addEventListener("input", saveDraft);

function setStatus(msg) {
  outStatus.textContent = msg;
  if (msg) setTimeout(() => { if (outStatus.textContent === msg) outStatus.textContent = ""; }, 5000);
}

// Start a fresh pad with a bullet so you can just type.
outline.addEventListener("focus", () => {
  if (outline.value.trim() === "") { outline.value = "- "; outline.setSelectionRange(2, 2); }
});

function shiftLines(dir) {
  const v = outline.value, s = outline.selectionStart, e = outline.selectionEnd;
  const start = v.lastIndexOf("\n", s - 1) + 1;
  let end = v.indexOf("\n", e); if (end === -1) end = v.length;
  let firstDelta = 0, total = 0;
  const out = v.slice(start, end).split("\n").map((l, i) => {
    const nl = dir > 0 ? "  " + l : l.replace(/^(\t| {1,2})/, "");
    const d = nl.length - l.length;
    if (i === 0) firstDelta = d;
    total += d;
    return nl;
  });
  outline.value = v.slice(0, start) + out.join("\n") + v.slice(end);
  outline.selectionStart = Math.max(start, s + firstDelta);
  outline.selectionEnd = Math.max(outline.selectionStart, e + total);
  saveDraft();
}

// Enter continues the bullet at the same indent; Enter on an empty bullet outdents, then removes it.
function handleEnter(ev) {
  const v = outline.value, s = outline.selectionStart;
  if (s !== outline.selectionEnd) return;
  const ls = v.lastIndexOf("\n", s - 1) + 1;
  const m = v.slice(ls, s).match(/^(\s*)([-*•] )(.*)$/);
  if (!m) return;
  ev.preventDefault();
  const [, indent, marker, rest] = m;
  const nl = v.indexOf("\n", s);
  const after = v.slice(s, nl === -1 ? v.length : nl);
  if (rest.trim() === "" && after.trim() === "") {
    outline.setRangeText(indent.length >= 2 ? indent.slice(2) + marker : "", ls, s, "end");
  } else {
    outline.setRangeText("\n" + indent + marker, s, s, "end");
  }
  saveDraft();
}

outline.addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); shiftLines(e.shiftKey ? -1 : 1); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveOutline(); }
  else if (e.key === "Enter" && !e.shiftKey) handleEnter(e);
});

// Each line is a bullet; two spaces of indent = one level of nesting. "[ ] text" makes a todo.
function parseOutline(text) {
  const items = [];
  for (const raw of text.split("\n")) {
    if (!raw.trim()) continue;
    const m = raw.match(/^([ \t]*)(?:[-*•]\s+)?(.*)$/);
    const body = m[2].trim();
    if (!body || body === "-") continue;
    const todo = body.match(/^\[( |x|X)\]\s+(.*)$/);
    const name = todo ? `- [${todo[1] === " " ? " " : "x"}] ${todo[2]}` : body;
    items.push({ level: Math.floor(m[1].replace(/\t/g, "  ").length / 2), name, raw });
  }
  return items;
}

async function saveOutline() {
  if (saving) return;
  const items = parseOutline(outline.value);
  if (!items.length) { setStatus("Nothing to save"); return; }
  saving = true; outSave.disabled = true; showError("");
  const todayK = key(new Date());
  const stack = [];               // stack[level] = id of the latest node saved at that level
  let done = 0, failure = null;
  for (const it of items) {
    const level = Math.min(it.level, stack.length);       // can't skip a level
    const parent = level === 0 ? todayK : stack[level - 1];
    try {
      const res = await call("POST", "/nodes", { parent_id: parent, name: it.name, position: "bottom" });
      stack.length = level;
      stack[level] = res && res.item_id;
      done++;
    } catch (e) { failure = e; break; }
  }
  if (failure) {
    // Keep only what wasn't saved so a retry doesn't create duplicates.
    outline.value = items.slice(done).map((i) => i.raw).join("\n");
    showError(failure.message);
    setStatus(done ? `Saved ${done}, ${items.length - done} left` : "Not saved");
  } else {
    outline.value = "";
    setStatus(`Saved ${done} ${done === 1 ? "line" : "lines"} to today`);
  }
  saveDraft();
  try { await loadDay(todayK); } catch (e) {}
  saving = false; outSave.disabled = false;
  render();
}
outSave.onclick = saveOutline;

/* ---------- Controls ---------- */

function goToWeek() { calMonth = firstOfMonth(weekStart); loadWeek(); }
document.getElementById("prev").onclick = () => { weekStart.setDate(weekStart.getDate() - step()); goToWeek(); };
document.getElementById("next").onclick = () => { weekStart.setDate(weekStart.getDate() + step()); goToWeek(); };
document.getElementById("today").onclick = () => { weekStart = baseStart(); goToWeek(); };
document.getElementById("seg").onclick = (e) => {
  const s = Number(e.target.dataset && e.target.dataset.span);
  if (!s || s === span) return;
  span = s;
  try { localStorage.setItem("span", String(s)); } catch (err) {}
  weekStart = baseStart();
  goToWeek();
};
document.getElementById("refresh").onclick = () => loadWeek(true);
document.getElementById("extras").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-range]");
  if (!b || b.dataset.range === lateRange) return;
  lateRange = b.dataset.range;
  try { localStorage.setItem("lateRange", lateRange); } catch (err) {}
  loadWeek();
});

for (const [id, pref] of [["optHide", "hideDone"], ["optLate", "showLate"], ["optSoon", "showSoon"]]) {
  const el = document.getElementById(id);
  el.checked = prefs[pref];
  el.onchange = () => {
    prefs[pref] = el.checked; setPref(pref, el.checked);
    if (pref === "hideDone") render(); else loadWeek();   // hiding is instant; the others need to fetch days
  };
}

loadWeek();
</script>
</body>
