<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.7">
<meta name="notes-name" content="WB-Notes">
<meta name="remote" content="0">
<title>Workflowy Week Board</title>
<style>
  :root {
    --bg: #f4f5f7; --col: #ebecf0; --card: #fff; --text: #172b4d; --muted: #6b778c;
    --accent: #2f6fed; --today: #fff4d6; --border: #dfe1e6; --late: #fde8e8; --soon: #e3edff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --col: #1e2126; --card: #2a2e35; --text: #e6e8eb; --muted: #8b95a3;
            --accent: #6a9bff; --today: #3a3220; --border: #343942; --late: #3b2226; --soon: #202c42; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; flex: 0 1 auto; min-width: 200px; }
  .hsearch { flex: 1; display: flex; justify-content: center; min-width: max-content; }
  #searchBtn { white-space: nowrap; }
  .opts select { font: inherit; font-size: 13px; padding: 1px 2px; }
  header h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; white-space: nowrap; }
  .settings { position: relative; }
  .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 300px; max-width: calc(100vw - 24px); box-sizing: border-box;
         background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
         box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .pop[hidden] { display: none; }
  .pop label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .pop label:hover { background: rgba(127,127,127,.14); }
  .pop label span { flex: 1; min-width: 0; }
  .pop label small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .pop input[type=checkbox] { margin-top: 3px; }
  .pop select { flex: none; font: inherit; font-size: 13px; padding: 2px 4px; }
  .opts { display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
  .opts label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  button { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg.mini button { padding: 2px 8px; font-size: 12px; }
  .rng { margin: 0 4px 8px; }
  #error { flex: none; display: none; margin: 0 16px 8px; padding: 8px 12px; border-radius: 6px;
           background: #fde8e8; color: #8a1c1c; }

  /* Main area: day columns on the left (scroll sideways), sidebar fixed on the far right. */
  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 16px 16px; }
  #board { flex: 1; min-width: 0; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
  /* The sidebar is exactly as tall as the window area. Its panels flex to fit and scroll inside themselves
     (Daily page takes whatever room is left), so the column as a whole only scrolls on a tiny window. */
  #side { flex: 0 0 300px; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #extras { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  #extras:empty { display: none; }
  .panel { flex: none; background: var(--col); border-radius: 8px; padding: 10px; }
  .panel h3 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .panel h3 span { color: var(--muted); font-weight: 400; margin-left: auto; }
  .panel h3 .mini { padding: 0 6px; font-size: 12px; }
  /* The Daily page header stays on one line: [title] [‹ date ›] [expand] [reload]. Only the date shrinks (with …) if space runs out. */
  #pageHead { flex-wrap: nowrap; gap: 4px; overflow: hidden; white-space: nowrap; }
  #pageHead > * { flex: none; }
  #pageHead .mini { padding: 0 5px; }
  #pageHead .mini.nav { font-size: 18px; line-height: 1; padding: 0 6px 2px; }
  #pageHead #pagePrev { margin-left: auto; }
  #pageHead #outTitle { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #pageHead #outTitle.away { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #pageHead #pageExpand { margin-left: 4px; }

  /* Day columns: header (title + add box) stays put, tasks scroll underneath. */
  .col { flex: 1 0 220px; display: flex; flex-direction: column; max-height: 100%;
         background: var(--col); border-radius: 8px; padding: 8px; min-height: 140px; }
  #side .col { flex: 0 1 auto; width: 100%; max-height: 30vh; min-height: 70px; }
  .colhead { flex: none; padding-bottom: 4px; }
  .tasks { flex: 1; min-height: 0; overflow-y: auto; padding-top: 4px; }
  .col.today { background: var(--today); }
  .col.late { background: var(--late); }
  .col.soon { background: var(--soon); }
  .col.over { outline: 2px dashed var(--accent); }
  .col h2 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }
  .col h2 span { color: var(--muted); font-weight: 400; }
  .col .sub { font-size: 12px; color: var(--muted); margin: -4px 4px 8px; }
  .card { display: flex; gap: 8px; align-items: flex-start; background: var(--card); border-radius: 6px;
          padding: 8px; margin-bottom: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); cursor: grab; }
  .card.done .txt { text-decoration: line-through; color: var(--muted); }
  .card.dragging { opacity: .4; }
  .card input[type=checkbox] { margin-top: 3px; }
  .txt { flex: 1; word-break: break-word; }
  .note, .badge { display: block; font-size: 12px; color: var(--muted); }
  .via { display: block; font-size: 11px; color: var(--muted); margin-bottom: 1px; }
  .card.nested { cursor: default; }
  .grp { background: var(--card); border-radius: 6px; padding: 8px; margin-bottom: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); cursor: grab; }
  .grp.dragging { opacity: .4; }
  .grp .gh { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .grp .gh .ga { flex: none; border: none; background: none; color: var(--text); opacity: .8; font-size: 14px; line-height: 1; padding: 0 2px; cursor: pointer; width: 16px; }
  .grp .gh .ga:hover { color: var(--accent); opacity: 1; }
  .grp .gh .gt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp .gh .mv { flex: none; }
  .grp .gh .gc { flex: none; font-weight: 400; font-size: 11px; color: var(--muted); background: rgba(127,127,127,.18); border-radius: 10px; padding: 0 7px; white-space: nowrap; }
  .grp .gl { margin-top: 6px; padding-left: 4px; border-left: 2px solid rgba(127,127,127,.25); }
  .grp .gh .badge { display: inline; margin-left: 6px; font-weight: 400; }
  .subtog { display: inline-block; margin-top: 3px; padding: 0 6px; border: none; border-radius: 10px; background: rgba(127,127,127,.18);
            color: var(--muted); font-size: 11px; cursor: pointer; }
  .subtog:hover { color: var(--accent); }
  .sublist { margin: 4px 0 0; padding-left: 4px; border-left: 2px solid rgba(127,127,127,.25); }
  .sublist .sublist { margin-left: 10px; }
  .si { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; padding: 1px 0; cursor: default; }
  .si .sb { flex: none; width: 13px; text-align: center; color: var(--muted); }
  .si input[type=checkbox] { margin: 2px 0 0; }
  .si.done .st2 { text-decoration: line-through; color: var(--muted); }
  .si .st2 { flex: 1; min-width: 0; word-break: break-word; }
  .subload { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .del, .mv { border: none; background: none; color: var(--muted); padding: 0 4px; opacity: 0; display: inline-flex; align-items: center; justify-content: center; height: 20px; line-height: 1; flex: none; }
  .card:hover .del, .card:focus-within .del, .card:hover .mv, .card:focus-within .mv, .grp:hover .mv, .grp:focus-within .mv { opacity: 1; }
  @media (hover: none) { .del, .mv { opacity: 1; } }
  .mv:hover { color: var(--accent); }
  .del:hover { color: #de350b; }
  .card { position: relative; }
  .movepop { position: fixed; z-index: 80; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 8px; width: 250px; font-size: 13px; }
  .movepop .mq, .movepop .mr { display: flex; gap: 6px; }
  .movepop button { padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text); cursor: pointer; font: inherit; }
  .movepop .mq button { flex: 1; white-space: nowrap; padding: 5px 4px; }
  .movepop .mr input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .movepop .go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .movepop .cancel { color: var(--muted); }
  .add { display: block; width: 100%; padding: 7px 8px; border: 1px dashed var(--border); border-radius: 6px;
         background: transparent; color: var(--text); font: inherit; }
  .empty { color: var(--muted); font-size: 12px; padding: 2px 4px 8px; }

  /* Calendar */
  .calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .calhead button { padding: 2px 9px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .calgrid .dow { font-size: 11px; color: var(--muted); padding: 2px 0; }
  .calgrid .day { position: relative; border: none; background: transparent; padding: 5px 0; font-size: 12px; border-radius: 6px; }
  .calgrid .day:hover { background: var(--card); }
  .calgrid .day.other { color: var(--muted); opacity: .6; }
  .calgrid .day.inwin { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .calgrid .day.istoday { font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
  .calgrid .day i { position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
                    border-radius: 50%; background: var(--accent); }

  /* Outliner */
  /* Daily page: read from WorkFlowy, nested like the outline */
  /* Daily page fills the space left in the sidebar and scrolls inside itself. */
  #outliner { flex: 1 1 0; min-height: 300px; display: flex; flex-direction: column; }
  #outliner > h3, #outliner > #outline, #outliner > .outbar, #outliner > .viewbar { flex: none; }
  .pagetree { flex: 1 1 0; min-height: 60px; overflow-y: auto; scrollbar-width: thin; background: var(--card);
              border-radius: 6px; padding: 6px 8px; margin-bottom: 12px; font-size: 13px; }
  /* Expanded: the calendar and Past due / Upcoming panels hide, so the page (and the add pad) get the whole sidebar. */
  #side.expanded #cal, #side.expanded #extras { display: none; }
  .pl { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
  .pl .tg { flex: none; width: 20px; padding: 0; border: none; background: none; color: var(--text); opacity: .8; font-size: 17px; line-height: 1.15; text-align: center; }
  .pl button.tg { cursor: pointer; border-radius: 4px; }
  .pl button.tg:hover { color: var(--accent); opacity: 1; background: rgba(127,127,127,.18); }
  .pl .pc { color: var(--muted); font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .pl .b { flex: none; width: 13px; text-align: center; color: var(--muted); }
  .pl input[type=checkbox] { flex: none; margin: 2px 0 0; }
  .pl .t { flex: 1; min-width: 0; word-break: break-word; cursor: text; }
  .pl .pn { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .pl-edit { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .pl-edit textarea { width: 100%; box-sizing: border-box; resize: none; overflow: hidden; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--accent); border-radius: 4px; padding: 3px 5px; }
  .pl-edit .pe-note { font-size: 12px; border-color: var(--border); }
  .pl-edit .pe-note:focus { border-color: var(--accent); outline: none; }
  .pl-edit .pe-title:focus { outline: none; }
  .pl-edit .pe-hint { font-size: 10px; color: var(--muted); }
  #moveNotes { margin-left: auto; }
  .pl .addc, .pl .indc, .pl .delc { flex: none; border: none; background: none; color: var(--muted); padding: 0 4px; opacity: 0; }
  .pl .addc:hover, .pl .indc:hover { color: var(--accent); }
  .pl .delc:hover { color: #c0392b; }
  .pl:hover .addc, .pl:hover .indc, .pl:hover .delc, .pl:focus-within .addc, .pl:focus-within .indc, .pl:focus-within .delc { opacity: 1; }
  @media (hover: none) { .pl .addc, .pl .indc, .pl .delc { opacity: 1; } }
  .pl-add { padding: 2px 0 4px; }
  .pl-add input { width: 100%; font: inherit; padding: 3px 6px; border: 1px dashed var(--border);
                  border-radius: 4px; background: var(--card); color: var(--text); }
  .pl.done .t { text-decoration: line-through; color: var(--muted); }
  .pl.h .t { font-weight: 700; }
  #outline { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 8px; border-radius: 6px;
             border: 1px solid var(--border); background: var(--card); color: var(--text);
             font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; }
  /* Item view bar (shown when a search result is open in the page pane) */
  .viewbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px;
             color: var(--muted); margin: -2px 0 8px; }
  .viewbar[hidden] { display: none; }
  .viewbar button { padding: 2px 8px; font-size: 12px; }
  .viewbar a { color: var(--accent); text-decoration: none; }
  .viewbar a:hover { text-decoration: underline; }

  /* Search window */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex;
           align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
  .modal[hidden] { display: none; }
  .sm-list, .sm-item { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sm-list[hidden], .sm-item[hidden] { display: none; }
  .sm-item .viewbar { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sm-item .pagetree { flex: 1; min-height: 240px; padding: 8px 12px; }
  .modal-box { width: min(700px, 100%); max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
               background: var(--card); color: var(--text); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .sm-head { flex: none; display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .sm-head input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 6px;
                   border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .sm-filters { flex: none; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; font-size: 13px;
                border-bottom: 1px solid var(--border); }
  .sm-filters label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .sm-results { flex: 1; min-height: 120px; overflow-y: auto; }
  .sr-more { display: block; width: calc(100% - 24px); margin: 8px 12px; padding: 6px; }
  .sm-results .hint { padding: 16px 12px; color: var(--muted); font-size: 13px; }
  .sr { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .sr:hover, .sr.active { background: var(--col); }
  .sr .st { word-break: break-word; }
  .sr .sp { font-size: 11px; color: var(--muted); word-break: break-word; }
  .sr .st.done { color: var(--muted); text-decoration: line-through; }
  mark { background: #ffe27a; color: #000; border-radius: 2px; padding: 0 1px; }
  .sm-foot { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px;
             font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  .sm-foot .mini { padding: 2px 8px; }

  .ver a { color: #b45309; font-weight: 600; text-decoration: none; }
  .ver a:hover { text-decoration: underline; }
  .ver { flex: none; font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0 0; }
  .outbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }

  @media (max-width: 820px) {
    #main { flex-direction: column; overflow-y: auto; }
    #board { flex: none; height: 75vh; height: 75dvh; }
    #side { flex: none; width: 100%; overflow: visible; }
    #extras { flex: none; }
    #side .col { flex: none; max-height: 40vh; }
    #outliner { flex: none; min-height: 0; }
    .pagetree { flex: none; max-height: 60vh; }
    .modal { padding: 0; }
    .modal-box { width: 100%; max-height: none; height: 100vh; height: 100dvh; border-radius: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Workflowy Week Board <small id="range"></small></h1>
  <div class="hsearch"><button id="searchBtn" title="Search your whole outline (Ctrl+K)">&#128269; Search nodes</button></div>
  <div class="settings">
    <button id="settingsBtn" aria-haspopup="true" aria-expanded="false" title="Hide completed, Past due, Upcoming, Nested and Sub-items">&#9881; Settings</button>
    <div class="pop" id="settingsPop" role="menu" hidden>
      <label><input type="checkbox" id="optHide"><span>Hide completed<small>Leave ticked tasks out</small></span></label>
      <label><input type="checkbox" id="optLate"><span>Past due<small>Open tasks from before the days shown</small></span></label>
      <label><input type="checkbox" id="optSoon"><span>Upcoming<small>Tasks in the 14 days after the days shown</small></span></label>
      <label class="sel"><span>Nested<small>Tasks indented under a plain bullet. Group: one card per bullet. Flatten: each task its own card.</small></span>
        <select id="optNested"><option value="off">Off</option><option value="group">Group</option><option value="flatten">Flatten</option></select></label>
      <label><input type="checkbox" id="optSubs"><span>Sub-items<small>Count on tasks that have sub-items, and a checklist you can open</small></span></label>
    </div>
  </div>
  <div class="seg" id="seg" title="Days to show">
    <button data-span="3">3</button><button data-span="5">5</button><button data-span="7">7</button>
  </div>
  <button id="prev">&larr;</button>
  <button id="today">This week</button>
  <button id="next">&rarr;</button>
  <button id="refresh" title="Reload">&#8635;</button>
</header>
<div id="error"></div>
<div id="main">
  <div id="board"></div>
  <aside id="side">
    <section class="panel" id="cal"></section>
    <div id="extras"></div>
    <section class="panel" id="outliner">
      <h3 id="pageHead"><strong id="pageHeading">Daily page</strong><button class="mini nav" id="pagePrev" title="Previous day's page">&#8249;</button><span id="outTitle"></span><button class="mini nav" id="pageNext" title="Next day's page">&#8250;</button><button class="mini" id="pageExpand" title="Expand to fill the sidebar">&#x2922;</button><button class="mini" id="pageRefresh" title="Reload">&#8635;</button></h3>
      <div class="pagetree" id="pageTree">Loading…</div>
      <h3><strong id="notesHeading">Add to WB-Notes</strong><button class="mini" id="notesEdit" title="Change the name of the notes bullet">&#9998;</button><button class="mini" id="moveNotes" title="Move today's plain bullets into the notes bullet">Move notes in</button></h3>
      <textarea id="outline" spellcheck="true"
        placeholder="Add notes… (Tab indents, Ctrl+Enter saves)"></textarea>
      <div class="outbar"><button id="outSave">Save to WB-Notes</button><span id="outStatus"></span></div>
    </section>
    <div class="ver" id="ver"><span id="verText">Workflowy Week Board v1.0.7</span></div>
  </aside>
</div>

<div class="modal" id="searchModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="Search your outline">
    <div class="sm-list" id="listPane">
    <div class="sm-head">
      <input id="searchInput" type="search" placeholder="Search your outline…" autocomplete="off" spellcheck="false">
      <button id="searchClose" title="Close (Esc)">&#10005;</button>
    </div>
    <div class="sm-filters">
      <label><input type="checkbox" id="fCompleted" checked> Include completed</label>
      <label><input type="checkbox" id="fTodos"> Todos only</label>
      <label><input type="checkbox" id="fNotes" checked> Search notes</label>
    </div>
    <div class="sm-results" id="searchResults"></div>
    <div class="sm-foot"><span id="searchInfo"></span><button class="mini" id="searchRefresh" title="Download a fresh copy of your outline (WorkFlowy allows this once a minute)">Refresh index</button></div>
    </div>
    <div class="sm-item" id="itemPane" hidden>
      <div class="viewbar" id="viewBar"></div>
      <div class="pagetree" id="itemTree"></div>
    </div>
  </div>
</div>

<script>
const API = "/api/v1";
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MAX_MONTHS_BACK = 60;  // Past due "All" looks back at most this many months (5 years)
const LOOKAHEAD = 14;    // Upcoming scans this many days past the visible days (or past today)
const MAX_PARALLEL = 6;  // limit simultaneous requests to WorkFlowy
// Name of the bullet on today's page that holds your notes (found by name, created if missing).
// The server's NOTES_NAME setting provides the default; the pencil next to the heading overrides it in this browser.
const DEFAULT_NOTES_NAME = ((document.querySelector('meta[name="notes-name"]') || {}).content || "WB-Notes").trim() || "WB-Notes";
let notesName = loadNotesName();
function loadNotesName() {
  try { const v = (localStorage.getItem("notesName") || "").trim(); if (v) return v; } catch (e) {}
  return DEFAULT_NOTES_NAME;
}
function sameName(a, b) { return a.trim().toLowerCase() === b.trim().toLowerCase(); }   // ignores case and stray spaces

const cache = {};        // dateKey -> sorted node array
const dayBullets = {};   // dateKey -> plain bullets / headings under that day (they may hold tasks; see Nested)
const nest = {};         // bulletId -> { todos: tasks indented under that bullet }
const nestQueued = new Set();

function getPref(k) { try { return localStorage.getItem(k) === "1"; } catch (e) { return false; } }
function setPref(k, v) { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} }
function loadNestedMode() { try { const v = localStorage.getItem("nested"); return v === "group" || v === "flatten" ? v : "off"; } catch (e) { return "off"; } }
const prefs = { nested: loadNestedMode(), hideDone: getPref("hideDone"), showLate: getPref("showLate"), showSoon: getPref("showSoon"), showSubs: getBool("showSubs", true) };

// Past due range: "1".."4" weeks back, or "all". Default is 2 weeks.
let lateRange = loadLateRange();
let loadingExtras = false;   // true while Past due / Upcoming days are still being fetched
let loadToken = 0;           // lets a newer load cancel an older one
let viewItem = null;         // id of the search result open in the item editor, or null
let itemNodes = [];         // the open item (and its children) shown in the editor; viewItem is its id
let itemPath = [];          // names of the lines above the open item
const monthInfo = {};        // "YYYY-MM" -> does that calendar month exist? (used by "All")
function loadLateRange() {
  try { const v = localStorage.getItem("lateRange"); if (["all", "1", "2", "3", "4"].includes(v)) return v; } catch (e) {}
  return "2";
}

// span = days shown. 7 = Mon-Sun, 5 = Mon-Fri, 3 = today + next 2 days.
let span = loadSpan();
let weekStart = baseStart();               // Monday-based; change startOfWeek to use Sunday
let calMonth = firstOfMonth(weekStart);    // month shown in the sidebar calendar

function loadSpan() {
  try { const s = Number(localStorage.getItem("span")); if ([3, 5, 7].includes(s)) return s; } catch (e) {}
  return 5;
}
function baseStart() {
  const now = new Date();
  return span === 3 ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : startOfWeek(now);
}
function step() { return span === 3 ? 3 : 7; }   // arrows: 3-day mode pages by 3 days, others by a week

function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (x.getDay() + 6) % 7;       // days since Monday
  x.setDate(x.getDate() - diff);
  return x;
}
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function key(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function keyToDate(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function todayDate() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function plain(html) {
  return new DOMParser().parseFromString(html || "", "text/html").body.textContent;
}
function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg; el.style.display = msg ? "block" : "none";
}

async function call(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("Signed out. Redirecting to the sign-in page…"); }
  if (res.status === 404 && method === "GET") return null;   // day not created yet = empty column
  if (!res.ok) throw new Error(`${method} ${path} failed (${res.status}): ${await res.text()}`);
  return res.json();
}

async function loadDay(k) {
  const data = await call("GET", `/nodes?parent_id=${k}`);
  const nodes = data && data.nodes ? data.nodes : [];
  // Tasks only: skip plain bullets, headers, quotes and code blocks (anything not layoutMode "todo").
  const tasks = nodes.filter((n) => n.data && n.data.layoutMode === "todo");
  cache[k] = tasks.sort((a, b) => a.priority - b.priority);
  // Plain bullets and headings, kept so tasks indented under them can be found. The notes bullet is left out on purpose.
  dayBullets[k] = nodes.filter((n) => {
    const mode = (n.data && n.data.layoutMode) || "bullets";
    return /^(bullets|h[1-3])$/.test(mode) && !sameName(plain(n.name), notesName);
  }).sort((a, b) => a.priority - b.priority);
}

// Loads many days with a small worker pool. Returns the first error message, if any.
async function loadMany(keys) {
  const queue = [...keys];
  let firstError = "";
  const worker = async () => {
    while (queue.length) {
      try { await loadDay(queue.shift()); } catch (e) { if (!firstError) firstError = e.message; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(MAX_PARALLEL, queue.length) }, worker));
  return firstError;
}

function weekDays() {
  return [...Array(span)].map((_, i) => addDays(weekStart, i));
}

// Day keys for the Past due and Upcoming panels. Both are relative to the days on screen:
// Past due = days before the first visible day, Upcoming = days after the last visible day.
function extraKeys() {
  const days = weekDays();
  const first = days[0], last = days[days.length - 1];
  const late = [], soon = [];
  if (prefs.showLate) {
    if (lateRange === "all") {
      // Only scan months that actually exist in your calendar (found by discoverMonths).
      for (let m = MAX_MONTHS_BACK - 1; m >= 0; m--) {          // oldest month first
        const m1 = new Date(first.getFullYear(), first.getMonth() - m, 1);
        if (!monthInfo[key(m1).slice(0, 7)]) continue;
        const dim = new Date(m1.getFullYear(), m1.getMonth() + 1, 0).getDate();
        for (let day = 1; day <= dim; day++) {
          const d = new Date(m1.getFullYear(), m1.getMonth(), day);
          if (d < first) late.push(key(d));
        }
      }
    } else {
      for (let i = Number(lateRange) * 7; i >= 1; i--) late.push(key(addDays(first, -i)));   // oldest first
    }
  }
  if (prefs.showSoon) {
    for (let i = 1; i <= LOOKAHEAD; i++) soon.push(key(addDays(last, i)));
  }
  return { late, soon };
}

// Finds which calendar months exist (one cheap request per month) so "All" skips empty ones.
async function discoverMonths(force) {
  const anchor = weekDays()[0];            // months are counted back from the first day on screen
  const todo = [];
  for (let i = 0; i < MAX_MONTHS_BACK; i++) {
    const mk = key(new Date(anchor.getFullYear(), anchor.getMonth() - i, 1)).slice(0, 7);
    if (force || !(mk in monthInfo)) todo.push(mk);
  }
  let firstError = "";
  const worker = async () => {
    while (todo.length) {
      const mk = todo.shift();
      try { monthInfo[mk] = (await call("GET", `/nodes?parent_id=${mk}`)) !== null; }
      catch (e) { if (!firstError) firstError = e.message; }
    }
  };
  await Promise.all(Array.from({ length: MAX_PARALLEL }, worker));
  return firstError;
}

// The visible days load first so the board appears quickly; Past due / Upcoming fill in after.
// force = true re-reads everything (the reload button); otherwise Past due days already loaded are reused.
async function loadWeek(force = false) {
  showError("");
  const token = ++loadToken;
  const err1 = await loadMany(weekDays().map(key));
  if (token !== loadToken) return;
  if (err1) showError(err1);
  loadingExtras = prefs.showLate || prefs.showSoon;
  render();
  if (!loadingExtras) return;

  let err2 = "";
  if (prefs.showLate && lateRange === "all") err2 = await discoverMonths(force);
  if (token !== loadToken) return;
  const { late, soon } = extraKeys();
  const err3 = await loadMany([...late.filter((k) => force || !(k in cache)), ...soon]);
  if (token !== loadToken) return;
  loadingExtras = false;
  if (err2 || err3) showError(err2 || err3);
  render();
}

function collect(keys, onlyOpen) {
  const out = [];
  for (const k of keys) {
    for (const n of cache[k] || []) {
      if ((onlyOpen || prefs.hideDone) && n.completedAt) continue;
      out.push({ n, k });
    }
  }
  return out;
}

// Everything shown for one day, in outline order: its tasks, plus (when Nested is on) tasks indented under its bullets.
//   kind "task": a todo directly under the day.  "group": one card for a bullet and its tasks (Group mode).
//   kind "nested": one task that sits under a bullet (Flatten mode).
function entries(k, onlyOpen) {
  const hide = (n) => (onlyOpen || prefs.hideDone) && n.completedAt;
  const out = [];
  for (const n of cache[k] || []) if (!hide(n)) out.push({ kind: "task", n, k, p: n.priority, s: 0 });
  if (prefs.nested !== "off") {
    for (const b of dayBullets[k] || []) {
      const info = nest[b.id];
      if (!info || !info.todos.length) continue;
      if (prefs.nested === "group") {
        if (info.todos.some((t) => !hide(t)) || !(onlyOpen || prefs.hideDone)) out.push({ kind: "group", b, k, todos: info.todos, hideDone: !!(onlyOpen || prefs.hideDone), p: b.priority, s: 0 });
      } else {
        for (const t of info.todos) if (!hide(t)) out.push({ kind: "nested", n: t, b, k, p: b.priority, s: t.priority });
      }
    }
  }
  return out.sort((a, b) => a.p - b.p || a.s - b.s);
}
const entriesFor = (keys, onlyOpen) => keys.flatMap((k) => entries(k, onlyOpen));
function entryOpen(e) {
  if (e.kind === "group") return e.todos.filter((t) => !t.completedAt).length;
  return e.n.completedAt ? 0 : 1;
}
// Open tasks for a day, counting the ones under bullets when Nested is on (in either mode).
function openCount(k) {
  let n = (cache[k] || []).filter((t) => !t.completedAt).length;
  if (prefs.nested !== "off") {
    for (const b of dayBullets[k] || []) for (const t of (nest[b.id] && nest[b.id].todos) || []) if (!t.completedAt) n++;
  }
  return n;
}
function entryEl(e, showDate) {
  if (e.kind === "group") return groupCard(e, showDate);
  if (e.kind === "nested") return card(e.n, e.k, showDate, { bullet: e.b });
  return card(e.n, e.k, showDate);
}

function render() {
  const days = weekDays();
  const fmt = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const last = days[days.length - 1];
  document.getElementById("range").textContent = `${fmt(days[0])} – ${fmt(last)}, ${last.getFullYear()}`;
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", Number(b.dataset.span) === span));
  updatePageHeader();

  const board = document.getElementById("board");
  const scrolls = {};                                   // keep each column's scroll position across a redraw
  document.querySelectorAll("#board .col, #extras .col").forEach((c) => {
    const t = c.querySelector(".tasks");
    if (t && t.scrollTop) scrolls[c.dataset.key || c.className] = t.scrollTop;
  });
  board.innerHTML = "";
  const todayKey = key(new Date());
  const extra = extraKeys();

  for (const d of days) {
    const k = key(d);
    const col = document.createElement("div");
    col.className = "col" + (k === todayKey ? " today" : "");
    col.dataset.key = k;

    const ents = entries(k, false);
    const hasAny = (cache[k] || []).length > 0 || ents.length > 0;
    const open = openCount(k);

    // Header (day title + add box) stays fixed; only the task list below it scrolls.
    const head = document.createElement("div");
    head.className = "colhead";
    head.innerHTML = `<h2>${DAY_NAMES[d.getDay()]} ${d.getDate()}<span>${open} open</span></h2>`;
    const list = document.createElement("div");
    list.className = "tasks";
    if (!ents.length) {
      list.insertAdjacentHTML("beforeend",
        `<div class="empty">${hasAny ? "All done" : "Nothing yet"}</div>`);
    }
    for (const e of ents) list.appendChild(entryEl(e, false));

    const add = document.createElement("input");
    add.className = "add"; add.placeholder = "+ Add task"; add.enterKeyHint = "done";
    add.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !add.value.trim()) return;
      const name = add.value.trim(); add.value = "";
      await act(async () => {
        await call("POST", "/nodes", { parent_id: k, name, layoutMode: "todo", position: "bottom" });
        await loadDay(k);
      });
    });
    head.appendChild(add);
    col.append(head, list);

    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault(); col.classList.remove("over");
      const { id, from } = JSON.parse(e.dataTransfer.getData("text/plain") || "{}");
      if (!id || from === k) return;
      await act(async () => {
        await call("POST", `/nodes/${id}/move`, { parent_id: k, position: "bottom" });
        await Promise.all([loadDay(from), loadDay(k)]);
      });
    });

    board.appendChild(col);
    if (scrolls[k]) list.scrollTop = scrolls[k];
  }

  // Sidebar: calendar, then Past due / Upcoming (when turned on). The outliner below is static.
  renderCal();
  const extras = document.getElementById("extras");
  extras.innerHTML = "";
  if (prefs.showLate) {
    const sub = lateRange === "all" ? "All open tasks before this view"
      : `Open tasks from the ${lateRange} ${lateRange === "1" ? "week" : "weeks"} before this view`;
    extras.appendChild(extraColumn("Past due", sub, entriesFor(extra.late, true), "late",
      loadingExtras ? "Loading…" : "Nothing past due"));
  }
  if (prefs.showSoon) {
    extras.appendChild(extraColumn("Upcoming", `Tasks in the next ${LOOKAHEAD} days after this view`,
      entriesFor(extra.soon, false), "soon", loadingExtras ? "Loading…" : "Nothing upcoming"));
  }
  extras.querySelectorAll(".col").forEach((c) => { const t = c.querySelector(".tasks"); if (t && scrolls[c.className]) t.scrollTop = scrolls[c.className]; });
  scheduleKids();                                    // sub-item counts load in the background
  scheduleNested();                                  // so do the tasks under bullets (Nested)
}

// Panel for tasks from days outside the visible range. Cards show their date;
// they can be checked off, edited, deleted, or dragged onto a day column to reschedule.
function extraColumn(title, sub, items, cls, emptyText) {
  const col = document.createElement("div");
  col.className = "col " + cls;
  const open = items.reduce((t, e) => t + entryOpen(e), 0);
  const head = document.createElement("div");
  head.className = "colhead";
  head.innerHTML = `<h2>${title}<span>${open} open</span></h2><div class="sub">${sub}</div>`;
  if (cls === "late") {
    // How far back Past due looks: All, or 1-4 weeks.
    const seg = document.createElement("div");
    seg.className = "seg mini rng";
    seg.title = "How far back to look";
    seg.innerHTML = [["all", "All"], ["1", "1w"], ["2", "2w"], ["3", "3w"], ["4", "4w"]]
      .map(([v, label]) => `<button data-range="${v}" class="${lateRange === v ? "on" : ""}">${label}</button>`).join("");
    head.appendChild(seg);
  }
  const list = document.createElement("div");
  list.className = "tasks";
  if (!items.length) list.insertAdjacentHTML("beforeend", `<div class="empty">${emptyText}</div>`);
  for (const e of items) list.appendChild(entryEl(e, true));
  col.append(head, list);
  return col;
}

/* ---------- Sub-items on task cards ---------- */

// kids[taskId] = { count: direct sub-items, tree?: all sub-items once opened }. Counts are fetched in the background,
// one small request per visible task, and remembered until you press the reload button.
const kids = {};
const kidsQueued = new Set();
function loadOpenCards() { try { return new Set(JSON.parse(localStorage.getItem("openCards") || "[]")); } catch (e) { return new Set(); } }
const openCards = loadOpenCards();
function saveOpenCards() { try { localStorage.setItem("openCards", JSON.stringify([...openCards].slice(-1000))); } catch (e) {} }

function scheduleKids() {
  if (!prefs.showSubs) return;
  const { late, soon } = extraKeys();
  const items = [...collect(weekDays().map(key), false), ...collect(late, true), ...collect(soon, false)];
  for (const { n } of items) {
    if (kids[n.id] || kidsQueued.has(n.id)) continue;
    kidsQueued.add(n.id);
    gate(() => call("GET", `/nodes?parent_id=${n.id}`))
      .then((data) => { kids[n.id] = { count: data && data.nodes ? data.nodes.length : 0 }; })
      .catch(() => { kids[n.id] = { count: 0, failed: true }; })
      .finally(() => { kidsQueued.delete(n.id); refreshSubs(n.id); });
  }
}

function refreshSubs(id) {
  document.querySelectorAll(`.subwrap[data-id="${id}"]`).forEach((w) => fillSubs(w, id));
}

async function ensureTree(id) {
  const info = kids[id];
  if (!info || info.tree || info.loading) return;
  info.loading = true;
  try { info.tree = await fetchTree(id, PAGE_DEPTH); }
  catch (e) { info.tree = []; showError(e.message); }
  info.loading = false;
  refreshSubs(id);
}

function toggleSubs(id) {
  if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
  saveOpenCards();
  refreshSubs(id);
}

// The sub-items of a task as a small checklist (nested as deep as they go).
function subList(nodes) {
  const box = document.createElement("div");
  box.className = "sublist";
  for (const c of nodes) {
    const todo = c.data && c.data.layoutMode === "todo";
    if (prefs.hideDone && todo && c.completedAt) continue;
    const row = document.createElement("div");
    row.className = "si" + (todo && c.completedAt ? " done" : "");
    if (todo) {
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!c.completedAt;
      cb.addEventListener("change", async () => {
        try {
          await call("POST", `/nodes/${c.id}/${cb.checked ? "complete" : "uncomplete"}`);
          c.completedAt = cb.checked ? Math.floor(Date.now() / 1000) : null;
          row.classList.toggle("done", cb.checked);
        } catch (e) { showError(e.message); cb.checked = !cb.checked; }
      });
      row.appendChild(cb);
    } else {
      const b = document.createElement("span");
      b.className = "sb"; b.textContent = "•";
      row.appendChild(b);
    }
    const t = document.createElement("span");
    t.className = "st2"; t.textContent = visibleText(c.name) || "(empty)";
    row.appendChild(t);
    box.appendChild(row);
    if (c.children && c.children.length) box.appendChild(subList(c.children));
  }
  return box;
}

// Fills a card's sub-item area: a "▸ 3 sub-items" button, and the checklist when it's open.
function fillSubs(wrap, id) {
  wrap.innerHTML = "";
  const info = prefs.showSubs ? kids[id] : null;
  if (!info || !info.count) return;
  const open = openCards.has(id);
  const b = document.createElement("button");
  b.className = "subtog";
  b.textContent = `${open ? "▾" : "▸"} ${info.count} sub-item${info.count === 1 ? "" : "s"}`;
  b.title = open ? "Hide sub-items" : "Show sub-items";
  b.addEventListener("click", (e) => { e.stopPropagation(); toggleSubs(id); });
  wrap.appendChild(b);
  if (!open) return;
  if (info.tree) wrap.appendChild(subList(info.tree));
  else {
    const l = document.createElement("div");
    l.className = "subload"; l.textContent = "Loading…";
    wrap.appendChild(l);
    ensureTree(id);
  }
}

/* ---------- Nested tasks: plain bullets with tasks indented under them ---------- */

function loadGroupsClosed() { try { return new Set(JSON.parse(localStorage.getItem("groupsClosed") || "[]")); } catch (e) { return new Set(); } }
const groupsClosed = loadGroupsClosed();
function saveGroupsClosed() { try { localStorage.setItem("groupsClosed", JSON.stringify([...groupsClosed].slice(-1000))); } catch (e) {} }

// Group mode: one card for the bullet, its tasks as a checklist inside it. Drag it to move the bullet (and its tasks) to another day.
function groupCard(e, showDate) {
  const b = e.b, k = e.k;
  const el = document.createElement("div");
  el.className = "grp";
  el.dataset.id = b.id;
  el.draggable = true;
  el.addEventListener("dragstart", (ev) => {
    ev.dataTransfer.setData("text/plain", JSON.stringify({ id: b.id, from: k }));
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));

  const closed = groupsClosed.has(b.id);
  const open = e.todos.filter((t) => !t.completedAt).length;
  const head = document.createElement("div");
  head.className = "gh";
  const arrow = document.createElement("button");
  arrow.className = "ga"; arrow.textContent = closed ? "▸" : "▾"; arrow.title = closed ? "Show tasks" : "Hide tasks";
  arrow.addEventListener("click", () => { if (closed) groupsClosed.delete(b.id); else groupsClosed.add(b.id); saveGroupsClosed(); render(); });
  const title = document.createElement("span");
  title.className = "gt"; title.textContent = visibleText(b.name) || "(empty)"; title.title = title.textContent;
  if (showDate) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = keyToDate(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    title.appendChild(badge);
  }
  const pill = document.createElement("span");
  pill.className = "gc"; pill.textContent = `${open} of ${e.todos.length} open`;
  pill.title = "Tasks indented under this bullet";
  const mv = document.createElement("button");
  mv.className = "mv"; mv.innerHTML = CAL_ICON; mv.title = "Move this group (the bullet and its tasks) to a date…";
  mv.addEventListener("click", (ev) => {
    ev.stopPropagation();
    openMovePop(mv, k, (to) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(to) || to === k) return;
      act(async () => {
        await call("POST", `/nodes/${b.id}/move`, { parent_id: to, position: "bottom" });
        await Promise.all([loadDay(k), loadDay(to)]);
      });
    });
  });
  head.append(arrow, title, pill, mv);
  el.appendChild(head);

  if (!closed) {
    const list = document.createElement("div");
    list.className = "gl";
    for (const t of e.todos) {
      if (e.hideDone && t.completedAt) continue;
      const row = document.createElement("div");
      row.className = "si" + (t.completedAt ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!t.completedAt;
      cb.addEventListener("change", () => act(async () => {
        await call("POST", `/nodes/${t.id}/${cb.checked ? "complete" : "uncomplete"}`);
        t.completedAt = cb.checked ? Math.floor(Date.now() / 1000) : null;
      }));
      const txt = document.createElement("span");
      txt.className = "st2"; txt.textContent = visibleText(t.name) || "(empty)";
      row.append(cb, txt);
      list.appendChild(row);
    }
    el.appendChild(list);
  }
  return el;
}

// Fetches the tasks under each visible plain bullet, in the background, one small request per bullet (cached until ↻).
let nestTimer = null;
function scheduleNested() {
  if (prefs.nested === "off") return;
  const { late, soon } = extraKeys();
  for (const k of [...weekDays().map(key), ...late, ...soon]) {
    for (const b of dayBullets[k] || []) {
      if (nest[b.id] || nestQueued.has(b.id)) continue;
      nestQueued.add(b.id);
      gate(() => call("GET", `/nodes?parent_id=${b.id}`))
        .then((data) => {
          const todos = (data && data.nodes ? data.nodes : []).filter((n) => n.data && n.data.layoutMode === "todo");
          nest[b.id] = { todos: todos.sort((x, y) => x.priority - y.priority) };
        })
        .catch(() => { nest[b.id] = { todos: [], failed: true }; })
        .finally(() => { nestQueued.delete(b.id); redrawSoon(); });
    }
  }
}
// Redraws once after a burst of results, but never while you're typing in a box.
function redrawSoon() {
  if (nestTimer) return;
  nestTimer = setTimeout(function again() {
    const a = document.activeElement;
    if (a && a.matches && a.matches("#board input, #extras input")) { nestTimer = setTimeout(again, 600); return; }
    nestTimer = null;
    render();
  }, 300);
}

function card(n, k, showDate, opts) {
  const nested = opts && opts.bullet;                    // a task sitting under a bullet (Nested: Flatten)
  const el = document.createElement("div");
  el.className = "card" + (n.completedAt ? " done" : "") + (nested ? " nested" : "");
  el.dataset.id = n.id;
  el.draggable = !nested;                                // moving it out of its bullet would be a surprise
  el.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", JSON.stringify({ id: n.id, from: k }));
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = !!n.completedAt;
  cb.addEventListener("change", () => act(async () => {
    await call("POST", `/nodes/${n.id}/${cb.checked ? "complete" : "uncomplete"}`);
    if (nested) n.completedAt = cb.checked ? Math.floor(Date.now() / 1000) : null;
    else await loadDay(k);
  }));

  const txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = plain(n.name);
  if (nested) {                                          // which bullet it belongs to
    const via = document.createElement("span");
    via.className = "via"; via.textContent = (visibleText(opts.bullet.name) || "(empty)") + " ›";
    txt.prepend(via);
  }
  if (showDate) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = keyToDate(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    txt.appendChild(badge);
  }
  if (n.note) {
    const note = document.createElement("span");
    note.className = "note"; note.textContent = plain(n.note);
    txt.appendChild(note);
  }
  const subs = document.createElement("div");
  subs.className = "subwrap"; subs.dataset.id = n.id;
  if (nested) subs.hidden = true;                          // (sub-item counts are only fetched for top-level tasks)
  subs.addEventListener("dblclick", (e) => e.stopPropagation());   // double-clicking a sub-item isn't editing the task
  fillSubs(subs, n.id);
  txt.appendChild(subs);
  txt.title = "Double-click to edit";
  txt.addEventListener("dblclick", () => {
    const current = plain(n.name);
    const next = prompt("Edit task", current);
    if (next === null || next.trim() === "" || next === current) return;
    act(async () => {
      await call("POST", `/nodes/${n.id}`, { name: next.trim() });
      if (nested) n.name = next.trim(); else await loadDay(k);
    });
  });

  const del = document.createElement("button");
  del.className = "del"; del.innerHTML = X_ICON; del.title = "Delete";
  del.addEventListener("click", () => {
    const sc = prefs.showSubs && kids[n.id] ? kids[n.id].count : 0;
    if (!confirm(sc ? `Delete this task and its ${sc} sub-item${sc === 1 ? "" : "s"} (and anything under them) permanently?` : "Delete this task permanently?")) return;
    act(async () => {
      await call("DELETE", `/nodes/${n.id}`);
      if (nested) { const info = nest[opts.bullet.id]; if (info) info.todos = info.todos.filter((x) => x !== n); }
      else await loadDay(k);
    });
  });

  const mv = document.createElement("button");
  mv.className = "mv"; mv.innerHTML = CAL_ICON; mv.title = "Move to a date…";
  const moveTo = (to) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(to) || to === k) return;
    act(async () => {
      await call("POST", `/nodes/${n.id}/move`, { parent_id: to, position: "bottom" });
      if (nested) { const info = nest[opts.bullet.id]; if (info) info.todos = info.todos.filter((x) => x !== n); }
      await Promise.all([nested ? null : loadDay(k), loadDay(to)]);
    });
  };
  mv.addEventListener("click", (e) => { e.stopPropagation(); openMovePop(mv, k, moveTo); });

  el.append(cb, txt, mv, del);
  return el;
}

/* ---------- Move-to-date popover (closes on Cancel, Esc, or a click elsewhere) ---------- */
const CAL_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>';
const X_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>';
let movePop = null;
function closeMovePop() { if (movePop) { movePop.remove(); movePop = null; } }
function openMovePop(anchor, from, onPick) {
  const wasMine = movePop && movePop._anchor === anchor;
  closeMovePop();
  if (wasMine) return;                                     // clicking 📅 again just closes it
  const pop = document.createElement("div");
  pop.className = "movepop"; pop._anchor = anchor;
  pop.addEventListener("click", (e) => e.stopPropagation());
  const quick = document.createElement("div");
  quick.className = "mq";
  const today = new Date();
  const nextMon = addDays(today, ((8 - today.getDay()) % 7) || 7);
  for (const [label, d] of [["Today", today], ["Tomorrow", addDays(today, 1)], ["Mon", nextMon]]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.addEventListener("click", () => { closeMovePop(); onPick(key(d)); });
    quick.appendChild(b);
  }
  const row = document.createElement("div");
  row.className = "mr";
  const inp = document.createElement("input");
  inp.type = "date"; inp.value = from;
  const go = document.createElement("button");
  go.type = "button"; go.textContent = "Move"; go.className = "go";
  go.addEventListener("click", () => { if (inp.value) { closeMovePop(); onPick(inp.value); } });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  row.append(inp, go);
  const cancel = document.createElement("button");
  cancel.type = "button"; cancel.textContent = "Cancel"; cancel.className = "cancel";
  cancel.addEventListener("click", closeMovePop);
  pop.append(quick, row, cancel);
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  pop.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  movePop = pop;
}
document.addEventListener("click", closeMovePop);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && movePop) { closeMovePop(); e.stopPropagation(); } }, true);
window.addEventListener("scroll", closeMovePop, true);

async function act(fn) {
  showError("");
  try { await fn(); } catch (e) { showError(e.message); }
  render();
}

/* ---------- Calendar ---------- */

function renderCal() {
  const el = document.getElementById("cal");
  const inWindow = new Set(weekDays().map(key));
  const todayK = key(new Date());
  const label = calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const gridStart = addDays(calMonth, -((calMonth.getDay() + 6) % 7));   // Monday-first grid
  let html = `<div class="calhead"><button data-cal="-1" title="Previous month">&lsaquo;</button>` +
             `<strong>${label}</strong><button data-cal="1" title="Next month">&rsaquo;</button></div><div class="calgrid">`;
  for (const w of ["M", "T", "W", "T", "F", "S", "S"]) html += `<div class="dow">${w}</div>`;
  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i), k = key(d);
    const cls = ["day"];
    if (d.getMonth() !== calMonth.getMonth()) cls.push("other");
    if (inWindow.has(k)) cls.push("inwin");
    if (k === todayK) cls.push("istoday");
    const hasOpen = (cache[k] || []).some((n) => !n.completedAt);   // dot only for days already loaded
    html += `<button class="${cls.join(" ")}" data-key="${k}">${d.getDate()}${hasOpen ? "<i></i>" : ""}</button>`;
  }
  el.innerHTML = html + "</div>";
}

document.getElementById("cal").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.cal) {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(btn.dataset.cal), 1);
    renderCal();
  } else if (btn.dataset.key) {
    const d = keyToDate(btn.dataset.key);
    weekStart = span === 3 ? d : startOfWeek(d);   // jump the board to the week (or 3 days) containing it
    calMonth = firstOfMonth(d);
    loadWeek();
  }
});

/* ---------- Outliner (saves to today's daily page) ---------- */

const outline = document.getElementById("outline");
const outSave = document.getElementById("outSave");
const outStatus = document.getElementById("outStatus");
let saving = false;

function saveDraft() { try { localStorage.setItem("outlineDraft", outline.value); } catch (e) {} }
try { outline.value = localStorage.getItem("outlineDraft") || ""; } catch (e) {}
outline.addEventListener("input", saveDraft);

function setStatus(msg) {
  outStatus.textContent = msg;
  if (msg) setTimeout(() => { if (outStatus.textContent === msg) outStatus.textContent = ""; }, 5000);
}

// Start a fresh pad with a bullet so you can just type.
outline.addEventListener("focus", () => {
  if (outline.value.trim() === "") { outline.value = "- "; outline.setSelectionRange(2, 2); }
});

function shiftLines(dir) {
  const v = outline.value, s = outline.selectionStart, e = outline.selectionEnd;
  const start = v.lastIndexOf("\n", s - 1) + 1;
  let end = v.indexOf("\n", e); if (end === -1) end = v.length;
  let firstDelta = 0, total = 0;
  const out = v.slice(start, end).split("\n").map((l, i) => {
    const nl = dir > 0 ? "  " + l : l.replace(/^(\t| {1,2})/, "");
    const d = nl.length - l.length;
    if (i === 0) firstDelta = d;
    total += d;
    return nl;
  });
  outline.value = v.slice(0, start) + out.join("\n") + v.slice(end);
  outline.selectionStart = Math.max(start, s + firstDelta);
  outline.selectionEnd = Math.max(outline.selectionStart, e + total);
  saveDraft();
}

// Enter continues the bullet at the same indent; Enter on an empty bullet outdents, then removes it.
function handleEnter(ev) {
  const v = outline.value, s = outline.selectionStart;
  if (s !== outline.selectionEnd) return;
  const ls = v.lastIndexOf("\n", s - 1) + 1;
  const m = v.slice(ls, s).match(/^(\s*)([-*•] )(.*)$/);
  if (!m) return;
  ev.preventDefault();
  const [, indent, marker, rest] = m;
  const nl = v.indexOf("\n", s);
  const after = v.slice(s, nl === -1 ? v.length : nl);
  if (rest.trim() === "" && after.trim() === "") {
    outline.setRangeText(indent.length >= 2 ? indent.slice(2) + marker : "", ls, s, "end");
  } else {
    outline.setRangeText("\n" + indent + marker, s, s, "end");
  }
  saveDraft();
}

outline.addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); shiftLines(e.shiftKey ? -1 : 1); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveOutline(); }
  else if (e.key === "Enter" && !e.shiftKey) handleEnter(e);
});

// Each line is a bullet; two spaces of indent = one level of nesting. "[ ] text" makes a todo.
function parseOutline(text) {
  const items = [];
  for (const raw of text.split("\n")) {
    if (!raw.trim()) continue;
    const m = raw.match(/^([ \t]*)(?:[-*•]\s+)?(.*)$/);
    const body = m[2].trim();
    if (!body || body === "-") continue;
    const todo = body.match(/^\[( |x|X)\]\s+(.*)$/);
    const name = todo ? `- [${todo[1] === " " ? " " : "x"}] ${todo[2]}` : body;
    items.push({ level: Math.floor(m[1].replace(/\t/g, "  ").length / 2), name, raw });
  }
  return items;
}

// Looks for a bullet with this name (ignoring case) among the top-level lines of today's page.
async function findNotes(todayK, name) {
  const data = await call("GET", `/nodes?parent_id=${todayK}`);
  const nodes = (data && data.nodes ? data.nodes : []).sort((a, b) => a.priority - b.priority);
  return nodes.find((n) => sameName(plain(n.name), name)) || null;
}

// Finds today's notes bullet by name, or creates it at the bottom of today's page.
async function ensureNotesId(todayK) {
  const hit = await findNotes(todayK, notesName);
  if (hit) return hit.id;
  const res = await call("POST", "/nodes", { parent_id: todayK, name: notesName, position: "bottom" });
  if (!res || !res.item_id) throw new Error(`Couldn't create the ${notesName} bullet`);
  return res.item_id;
}

// Pencil next to the heading: choose the notes bullet's name (saved in this browser; the server setting is the default).
async function changeNotesName() {
  if (saving) return;
  const input = prompt(`Name of the notes bullet on today's page:\n(server default: "${DEFAULT_NOTES_NAME}")`, notesName);
  if (input === null) return;
  const next = input.trim().replace(/\s+/g, " ");
  if (!next) { showError("The notes bullet needs a name."); return; }
  if (next === notesName) return;
  showError("");
  const todayK = key(new Date());
  let usingExisting = false;
  try {
    const current = await findNotes(todayK, notesName);
    // If today already has a bullet with the new name, just use it instead of renaming (no duplicates).
    const taken = sameName(next, notesName) ? null : await findNotes(todayK, next);
    if (taken) usingExisting = true;
    else if (current && confirm(`Also rename today's "${notesName}" bullet to "${next}"?\n\n` +
        `OK renames it. Cancel leaves it as it is, and the board will start a separate "${next}" bullet the next time you save.`)) {
      await call("POST", `/nodes/${current.id}`, { name: next });
    }
  } catch (e) { showError(e.message); return; }
  notesName = next;
  try {
    if (next === DEFAULT_NOTES_NAME) localStorage.removeItem("notesName");   // back to the server default
    else localStorage.setItem("notesName", next);
  } catch (e) {}
  applyNotesLabels();
  if (usingExisting) setStatus(`Now using your existing "${next}" bullet`);
  await loadPage();
}

function applyNotesLabels() {
  document.getElementById("notesHeading").textContent = "Add to " + notesName;
  outSave.textContent = "Save to " + notesName;
  moveBtn.title = `Move today's plain bullets into ${notesName}`;
}

// Moves today's plain top-level bullets (with their sub-bullets) under the notes bullet, keeping their order.
// Todos, headings and the notes bullet itself stay where they are.
async function moveNotes() {
  if (saving) return;
  const todayK = key(new Date());
  let nodes;
  try {
    const data = await call("GET", `/nodes?parent_id=${todayK}`);
    nodes = (data && data.nodes ? data.nodes : []).sort((a, b) => a.priority - b.priority);
  } catch (e) { showError(e.message); return; }
  const movable = nodes.filter((n) =>
    !sameName(plain(n.name), notesName) && ((n.data && n.data.layoutMode) || "bullets") === "bullets");
  if (!movable.length) { setStatus("No plain bullets to move"); return; }
  const preview = movable.slice(0, 5).map((n) => "• " + (plain(n.name).slice(0, 60) || "(empty)")).join("\n") +
    (movable.length > 5 ? `\n…and ${movable.length - 5} more` : "");
  if (!confirm(`Move ${movable.length} bullet${movable.length === 1 ? "" : "s"} from today's page into ${notesName}?\n\n` +
               `${preview}\n\nSub-bullets move with them. Todos and headings stay put.`)) return;

  saving = true; outSave.disabled = true; moveBtn.disabled = true; showError("");
  let moved = 0;
  try {
    const notesId = await ensureNotesId(todayK);
    for (const n of movable) {
      await call("POST", `/nodes/${n.id}/move`, { parent_id: notesId, position: "bottom" });
      moved++;
    }
    setStatus(`Moved ${moved} into ${notesName}`);
  } catch (e) {
    showError(e.message);
    setStatus(moved ? `Moved ${moved}, then stopped` : "Nothing moved");
  }
  saving = false; outSave.disabled = false; moveBtn.disabled = false;
  try { await loadDay(todayK); } catch (e) {}
  render();
  await loadPage();
}
const moveBtn = document.getElementById("moveNotes");
moveBtn.onclick = moveNotes;

async function saveOutline() {
  if (saving) return;
  const items = parseOutline(outline.value);
  if (!items.length) { setStatus("Nothing to save"); return; }
  saving = true; outSave.disabled = true; showError("");
  const todayK = key(new Date());
  let notesId;
  try { notesId = await ensureNotesId(todayK); }          // find (or create) the WB-Notes bullet first
  catch (e) {
    showError(e.message); setStatus("Not saved");
    saving = false; outSave.disabled = false;
    return;
  }
  const stack = [];               // stack[level] = id of the latest node saved at that level
  let done = 0, failure = null;
  for (const it of items) {
    const level = Math.min(it.level, stack.length);       // can't skip a level
    const parent = level === 0 ? notesId : stack[level - 1];
    try {
      const res = await call("POST", "/nodes", { parent_id: parent, name: it.name, position: "bottom" });
      stack.length = level;
      stack[level] = res && res.item_id;
      done++;
    } catch (e) { failure = e; break; }
  }
  if (failure) {
    // Keep only what wasn't saved so a retry doesn't create duplicates.
    outline.value = items.slice(done).map((i) => i.raw).join("\n");
    showError(failure.message);
    setStatus(done ? `Saved ${done}, ${items.length - done} left` : "Not saved");
  } else {
    outline.value = "";
    setStatus(`Saved ${done} ${done === 1 ? "line" : "lines"} to ${notesName}`);
  }
  saveDraft();
  try { await loadDay(todayK); } catch (e) {}
  saving = false; outSave.disabled = false;
  render();
  await loadPage();          // show what's on today's page now, including what was just saved
}
outSave.onclick = saveOutline;

/* ---------- Editing a line in place (keeps bold, links and other formatting) ---------- */

// WorkFlowy stores formatting as markup inside the text. These helpers let you edit just the visible words.
const entityCache = {};
function decodeEntity(e) {
  return entityCache[e] || (entityCache[e] = new DOMParser().parseFromString(e, "text/html").body.textContent);
}
// Splits stored text into tags (no visible text), <br> (a line break), entities like &amp; and ordinary characters.
function tokenize(raw) {
  const out = [];
  for (const m of String(raw || "").matchAll(/<br\s*\/?>|<[^>]*>|&(?:#\d+|#x[0-9a-f]+|[a-z][a-z0-9]*);|[\s\S]/gi)) {
    const r = m[0];
    if (/^<br/i.test(r)) out.push({ raw: r, text: "\n" });
    else if (r.length > 1 && r[0] === "<") out.push({ raw: r, text: "" });
    else if (r.length > 1 && r[0] === "&") out.push({ raw: r, text: decodeEntity(r) });
    else out.push({ raw: r, text: r });
  }
  return out;
}
const visibleText = (raw) => tokenize(raw).map((t) => t.text).join("");
const escapeMarkup = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// The stored text to save after the visible words were changed from what visibleText(raw) gave to `next`.
// Plain text is sent as typed. Formatted text keeps its tags: only the words that changed are replaced.
function applyEdit(raw, next) {
  const toks = tokenize(raw);
  const old = toks.map((t) => t.text).join("");
  if (old === next) return raw;
  if (!toks.some((t) => t.raw !== t.text)) return next;
  let p = 0;
  while (p < old.length && p < next.length && old[p] === next[p]) p++;
  let s = 0;
  while (s < old.length - p && s < next.length - p && old[old.length - 1 - s] === next[next.length - 1 - s]) s++;
  const delStart = p, delEnd = old.length - s, insert = escapeMarkup(next.slice(p, next.length - s));
  const pureInsert = delStart === delEnd;
  let pos = 0, out = "", inserted = false;
  if (pureInsert && delStart === 0) { out = insert; inserted = true; }   // typing at the very start
  for (const t of toks) {
    if (!t.text.length) { out += t.raw; continue; }          // tags stay where they are
    const a = pos, b = pos + t.text.length;
    pos = b;
    if (!pureInsert && !inserted && a >= delStart) { out += insert; inserted = true; }   // replacing: new words go where the old ones were
    if (a >= delStart && b <= delEnd && !pureInsert) continue;   // a removed character
    out += t.raw;
    if (pureInsert && !inserted && b === delStart) { out += insert; inserted = true; }   // typing continues the formatting of the character before
  }
  if (!inserted) out += insert;
  return visibleText(out) === next ? out : escapeMarkup(next);   // safety net: never save something that reads differently
}

// Replaces the line's text with editing boxes (title, and its note). Enter saves, Esc cancels, clicking away saves.
function startEdit(n, textEl, onSaved) {
  const origName = n.name || "", origNote = n.note || "";
  const titleText = visibleText(origName), noteText = visibleText(origNote);
  const box = document.createElement("div");
  box.className = "pl-edit";
  const title = document.createElement("textarea");
  title.className = "pe-title"; title.rows = 1; title.value = titleText;
  const note = document.createElement("textarea");
  note.className = "pe-note"; note.rows = 2; note.value = noteText; note.placeholder = "Note";
  const hint = document.createElement("div");
  hint.className = "pe-hint"; hint.textContent = "Enter saves · Esc cancels · Shift+Enter: new line in the note";
  box.append(title, note, hint);
  textEl.replaceWith(box);
  const fit = (el) => { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; };
  [title, note].forEach((el) => { el.addEventListener("input", () => fit(el)); fit(el); });

  let finished = false;
  const finish = async (save) => {
    if (finished) return;
    finished = true;
    if (!save) { box.replaceWith(textEl); return; }
    const nextTitle = title.value.replace(/\s*\n\s*/g, " ").trim();
    const nextNote = note.value.replace(/\s+$/, "");
    const body = {};
    if (nextTitle && nextTitle !== titleText) body.name = applyEdit(origName, nextTitle);
    if (nextNote !== noteText) body.note = nextNote === "" ? "" : applyEdit(origNote, nextNote);
    if (!Object.keys(body).length) { box.replaceWith(textEl); return; }
    title.disabled = note.disabled = true;
    try { await call("POST", `/nodes/${n.id}`, body); await onSaved(); }
    catch (e) { showError(e.message); finished = false; title.disabled = note.disabled = false; title.focus(); }
  };
  const keys = (multiline) => (e) => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
    else if (e.key === "Enter" && !(multiline && e.shiftKey)) { e.preventDefault(); finish(true); }
  };
  title.addEventListener("keydown", keys(false));
  note.addEventListener("keydown", keys(true));
  box.addEventListener("focusout", () => setTimeout(() => { if (!finished && !box.contains(document.activeElement)) finish(true); }, 0));
  title.focus(); title.select();
}

/* ---------- Daily page (read from WorkFlowy, shown above the pad) ---------- */

const PAGE_DEPTH = 12;       // how many levels of nesting to read (each bullet costs one request)
const pageTree = document.getElementById("pageTree");
const itemTree = document.getElementById("itemTree");

// Collapsed lines (their sub-bullets are hidden). Kept in this browser only: WorkFlowy's API can't read or change it.
function loadCollapsed() { try { return new Set(JSON.parse(localStorage.getItem("collapsed") || "[]")); } catch (e) { return new Set(); } }
const collapsed = loadCollapsed();
function setCollapsed(id, on) {
  if (on) collapsed.add(id); else collapsed.delete(id);
  try { localStorage.setItem("collapsed", JSON.stringify([...collapsed].slice(-3000))); } catch (e) { /* not remembered */ }
}
const countBelow = (x) => (x.children || []).reduce((t, c) => t + 1 + countBelow(c), 0);
let pageNodes = [];
let pageOffset = 0;          // which day's page the pane shows: 0 = today, -1 = yesterday, 1 = tomorrow...
const pageDay = () => addDays(new Date(), pageOffset);
const pageKey = () => key(pageDay());
let pageToken = 0;
let addingFor = null;        // id of the line that currently has its "add under this line" box open
let gateActive = 0;
const gateWaiters = [];

// Keeps the number of simultaneous requests for the page tree small.
async function gate(fn) {
  if (gateActive >= MAX_PARALLEL) await new Promise((r) => gateWaiters.push(r));
  gateActive++;
  try { return await fn(); }
  finally { gateActive--; const w = gateWaiters.shift(); if (w) w(); }
}

// topLevel = true skips the page's own tasks (top-level todos); those live on the board, not in this pane.
async function fetchTree(parent, depth, topLevel = false) {
  const data = await gate(() => call("GET", `/nodes?parent_id=${parent}`));
  let nodes = (data && data.nodes ? data.nodes : []).sort((a, b) => a.priority - b.priority);
  if (topLevel) nodes = nodes.filter((n) => !(n.data && n.data.layoutMode === "todo"));
  if (depth > 1) {
    await Promise.all(nodes.map(async (n) => { n.children = await fetchTree(n.id, depth - 1); }));
  }
  return nodes;
}

async function loadPage() {
  if (viewItem) return;                       // the item editor is open; Daily page reloads when you go back
  const token = ++pageToken;
  if (!pageNodes.length) pageTree.textContent = "Loading…";
  try {
    const tree = await fetchTree(pageKey(), PAGE_DEPTH, true);
    if (token !== pageToken) return;
    pageNodes = tree;
    renderPage();
  } catch (e) {
    if (token !== pageToken) return;
    pageTree.textContent = "Couldn't load the page: " + e.message;
  }
}

// Draws Daily page in the sidebar, or (when a search result is open) the item editor inside the search window.
function renderPage() {
  const tree = viewItem ? itemTree : pageTree;
  const roots = viewItem ? itemNodes : pageNodes;
  const keepScroll = tree.scrollTop;          // stay where you were after a reload or edit
  tree.innerHTML = "";
  if (!roots.length) {
    tree.innerHTML = `<div class="empty">${viewItem ? "Nothing here" : "No notes on this page yet"}</div>`;
    return;
  }
  // inNotes: this line is the notes bullet or sits inside it. The notes bullet itself can't be removed from here.
  const walk = (nodes, level, inNotes) => {
    nodes.forEach((n, i) => {
      const isNotesBullet = !inNotes && !viewItem && level === 0 && sameName(plain(n.name), notesName);
      const here = inNotes || isNotesBullet;
      const hasKids = !!(n.children && n.children.length);
      const closed = hasKids && collapsed.has(n.id) && addingFor !== n.id;   // adding under a line opens it
      // "−" is offered everywhere on Daily page except the notes bullet itself, and inside it only on lines with nothing underneath
      // In the item editor from search: only lines with nothing underneath, and never the opened item itself.
      const removable = viewItem ? (level > 0 && !hasKids) : (!isNotesBullet && (!here || !hasKids));
      tree.appendChild(pageLine(n, level, i > 0 ? nodes[i - 1] : null, removable, hasKids ? (closed ? "closed" : "open") : ""));
      if (hasKids && !closed) walk(n.children, level + 1, here);
      if (addingFor === n.id) tree.appendChild(addRow(n, level + 1));   // new lines go at the bottom
    });
  };
  walk(roots, 0, false);
  tree.scrollTop = keepScroll;
  const box = tree.querySelector(".pl-add input");
  if (box) box.focus();
}

// Small input that adds a new line as the last child of `parent`. Stays open for quick repeat adds.
function addRow(parent, level) {
  const wrap = document.createElement("div");
  wrap.className = "pl-add";
  wrap.style.paddingLeft = level * 16 + "px";
  const input = document.createElement("input");
  input.placeholder = "Add under this line… (Enter adds, Esc closes)";
  input.addEventListener("keydown", async (e) => {
    if (e.key === "Escape") { e.stopPropagation(); addingFor = null; renderPage(); return; }
    if (e.key !== "Enter" || !input.value.trim()) return;
    const name = input.value.trim();
    input.disabled = true;
    try {
      const res = await call("POST", "/nodes", { parent_id: parent.id, name, position: "bottom" });
      if (viewItem) await reloadItem(); else await loadPage();
    } catch (err) { showError(err.message); input.disabled = false; }
  });
  wrap.appendChild(input);
  return wrap;
}

// One line of today's page. Todos get a checkbox; double-click any line to edit its text.
// `prev` is the line directly above at the same level (none for the first line of a group).
function pageLine(n, level, prev, removable, fold) {
  const mode = (n.data && n.data.layoutMode) || "bullets";
  const row = document.createElement("div");
  row.className = "pl" + (mode === "todo" && n.completedAt ? " done" : "") + (/^h[1-3]$/.test(mode) ? " h" : "");
  row.style.paddingLeft = level * 16 + "px";

  // ▾ / ▸ hides or shows the lines underneath (a blank spacer keeps lines without children lined up)
  const tg = document.createElement(fold ? "button" : "span");
  tg.className = "tg";
  if (fold) {
    tg.textContent = fold === "open" ? "▾" : "▸";
    tg.title = fold === "open" ? "Collapse" : "Expand";
    tg.addEventListener("click", () => { setCollapsed(n.id, fold === "open"); renderPage(); });
  }
  row.appendChild(tg);

  if (mode === "todo") {
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!n.completedAt;
    cb.addEventListener("change", async () => {
      try {
        await call("POST", `/nodes/${n.id}/${cb.checked ? "complete" : "uncomplete"}`);
        n.completedAt = cb.checked ? Math.floor(Date.now() / 1000) : null;
        n.completed = !!n.completedAt;
        renderPage();
        if (!viewItem) { await loadDay(pageKey()); render(); }
      } catch (e) { showError(e.message); cb.checked = !cb.checked; }
    });
    row.appendChild(cb);
  } else {
    const b = document.createElement("span");
    b.className = "b"; b.textContent = "•";
    row.appendChild(b);
  }

  const t = document.createElement("span");
  t.className = "t";
  t.textContent = visibleText(n.name) || "(empty)";
  if (fold === "closed") {                             // how many lines are hidden
    const pc = document.createElement("span");
    const hidden = countBelow(n);
    pc.className = "pc"; pc.textContent = `(${hidden})`; pc.title = `${hidden} hidden line${hidden === 1 ? "" : "s"}`;
    t.appendChild(pc);
  }
  if (n.note && n.note.trim()) {                       // first line of the note, small and grey
    const pn = document.createElement("small");
    pn.className = "pn"; pn.textContent = visibleText(n.note).split("\n")[0];
    t.appendChild(pn);
  }
  t.title = "Click to edit";
  t.addEventListener("click", () => {
    if (String(window.getSelection && window.getSelection()) !== "") return;   // selecting text isn't editing
    startEdit(n, t, async () => {
      if (viewItem) await reloadItem();
      else { await Promise.all([loadPage(), loadDay(pageKey())]); render(); }
    });
  });
  row.appendChild(t);

  // ">" indents the line: it becomes the last child of the line above (and takes its sub-bullets with it).
  if (prev) {
    const ind = document.createElement("button");
    ind.className = "indc"; ind.textContent = ">"; ind.title = "Indent under the line above";
    ind.addEventListener("click", async () => {
      ind.disabled = true;
      try {
        await call("POST", `/nodes/${n.id}/move`, { parent_id: prev.id, position: "bottom" });
        setCollapsed(prev.id, false);
        if (viewItem) await reloadItem(); else await loadPage();
      } catch (e) { showError(e.message); ind.disabled = false; }
    });
    row.appendChild(ind);
  }

  const plus = document.createElement("button");
  plus.className = "addc"; plus.textContent = "+"; plus.title = "Add a line under this one";
  plus.addEventListener("click", () => { addingFor = addingFor === n.id ? null : n.id; renderPage(); });
  row.appendChild(plus);

  // "−" removes a line (and anything under it) from today's page. Not offered inside the notes bullet.
  if (removable) {
    const minus = document.createElement("button");
    minus.className = "delc"; minus.textContent = "−"; minus.title = "Delete this line";
    minus.addEventListener("click", async () => {
      const below = countBelow(n);
      const label = plain(n.name) || "(empty)";
      if (!confirm(`Delete this line permanently?\n\n"${label}"` + (below ? `\n\nIts ${below} line${below === 1 ? "" : "s"} underneath will be deleted too.` : ""))) return;
      minus.disabled = true;
      try { await call("DELETE", `/nodes/${n.id}`); if (viewItem) await reloadItem(); else await loadPage(); }
      catch (e) { showError(e.message); minus.disabled = false; }
    });
    row.appendChild(minus);
  }
  return row;
}
