<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.8">
<meta name="notes-name" content="WB-Notes">
<meta name="remote" content="0">
<title>Workflowy Week Board</title>
<style>
  :root {
    --bg: #f4f5f7; --col: #ebecf0; --card: #fff; --text: #172b4d; --muted: #6b778c;
    --accent: #2f6fed; --today: #fff4d6; --border: #dfe1e6; --late: #fde8e8; --soon: #e3edff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --col: #1e2126; --card: #2a2e35; --text: #e6e8eb; --muted: #8b95a3;
            --accent: #6a9bff; --today: #3a3220; --border: #343942; --late: #3b2226; --soon: #202c42; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; flex: 0 1 auto; min-width: 200px; }
  .hsearch { flex: 1; display: flex; justify-content: center; min-width: max-content; }
  #searchBtn { white-space: nowrap; }
  .opts select { font: inherit; font-size: 13px; padding: 1px 2px; }
  header h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; white-space: nowrap; }
  .settings { position: relative; }
  .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 300px; max-width: calc(100vw - 24px); box-sizing: border-box;
         background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
         box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .pop[hidden] { display: none; }
  .pop label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .pop label:hover { background: rgba(127,127,127,.14); }
  .pop label span { flex: 1; min-width: 0; }
  .pop label small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .pop input[type=checkbox] { margin-top: 3px; }
  .pop select { flex: none; font: inherit; font-size: 13px; padding: 2px 4px; }
  .opts { display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
  .opts label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  button { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg.mini button { padding: 2px 8px; font-size: 12px; }
  .rng { margin: 0 4px 8px; }
  .col h2 .xname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 700; }
  .col h2 .xr { flex: none; display: inline-flex; align-items: center; gap: 6px; }
  .xroll { padding: 0 8px; font-size: 12px; line-height: 18px; border-radius: 10px; color: var(--accent); }
  .xroll:disabled { color: var(--muted); }
  #extras .col:not(.folded):has(.card) .tasks { min-height: 96px; }
  .xtog { display: inline-flex; align-items: center; gap: 2px; border: none; background: rgba(127,127,127,.18); border-radius: 10px; padding: 0 9px; font-size: 12px; font-weight: 400; color: var(--muted); cursor: pointer; }
  .xtog:hover { color: var(--accent); }
  .xtog .ar { font-size: 15px; line-height: 1; }
  .col.folded { min-height: 0; padding-bottom: 4px; }
  .col.folded .colhead { padding-bottom: 0; }
  .col.folded h2 { margin-bottom: 4px; }
  #error { flex: none; display: none; margin: 0 16px 8px; padding: 8px 12px; border-radius: 6px;
           background: #fde8e8; color: #8a1c1c; }

  /* Main area: day columns on the left (scroll sideways), sidebar fixed on the far right. */
  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 16px 16px; }
  #board { flex: 1; min-width: 0; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
  /* The sidebar is exactly as tall as the window area. Its panels flex to fit and scroll inside themselves
     (Daily page takes whatever room is left), so the column as a whole only scrolls on a tiny window. */
  #side { flex: 0 0 300px; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #extras { flex: none; display: flex; flex-direction: column; gap: 10px; }   /* keeps its full height so the lists are always visible; the sidebar scrolls if the window is small */
  #extras:empty { display: none; }
  .panel { flex: none; background: var(--col); border-radius: 8px; padding: 10px; }
  .panel h3 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .panel h3 span { color: var(--muted); font-weight: 400; margin-left: auto; }
  .panel h3 .mini { padding: 0 6px; font-size: 12px; }
  /* The Daily page header stays on one line: [title] [‹ date ›] [expand] [reload]. Only the date shrinks (with …) if space runs out. */
  #pageHead { flex-wrap: nowrap; gap: 4px; overflow: hidden; white-space: nowrap; }
  #pageHead > * { flex: none; }
  #pageHead .mini { padding: 0 5px; }
  #pageHead .mini.nav { font-size: 18px; line-height: 1; padding: 0 6px 2px; }
  #pageHead #pagePrev { margin-left: auto; }
  #pageHead #outTitle { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #pageHead #outTitle.away { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #pageHead #pageExpand { margin-left: 4px; }

  /* Day columns: header (title + add box) stays put, tasks scroll underneath. */
  .col { flex: 1 0 220px; display: flex; flex-direction: column; max-height: 100%;
         background: var(--col); border-radius: 8px; padding: 8px; min-height: 140px; }
  #side .col { flex: 0 1 auto; width: 100%; max-height: 30vh; min-height: 70px; }
  .colhead { flex: none; padding-bottom: 4px; }
  .tasks { flex: 1; min-height: 0; overflow-y: auto; padding-top: 4px; }
  .col.today { background: var(--today); }
  .col.late { background: var(--late); }
  .col.soon { background: var(--soon); }
  .col.over { outline: 2px dashed var(--accent); }
  .col h2 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }
  .col h2 span { color: var(--muted); font-weight: 400; }
  .col .sub { font-size: 12px; color: var(--muted); margin: -4px 4px 8px; }
  .card { display: flex; gap: 8px; align-items: flex-start; background: var(--card); border-radius: 6px;
          padding: 8px; margin-bottom: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); cursor: grab; }
  .card.done .txt { text-decoration: line-through; color: var(--muted); }
  .card.dragging { opacity: .4; }
  .card input[type=checkbox] { margin-top: 3px; }
  .txt { flex: 1; word-break: break-word; }
  .note, .badge { display: block; font-size: 12px; color: var(--muted); }
  .via { display: block; font-size: 11px; color: var(--muted); margin-bottom: 1px; }
  .card.nested { cursor: default; }
  .grp { background: var(--card); border-radius: 6px; padding: 8px; margin-bottom: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); cursor: grab; }
  .grp.dragging { opacity: .4; }
  .grp .gh { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .grp .gh .ga { flex: none; border: none; background: none; color: var(--text); opacity: .8; font-size: 14px; line-height: 1; padding: 0 2px; cursor: pointer; width: 16px; }
  .grp .gh .ga:hover { color: var(--accent); opacity: 1; }
  .grp .gh .gt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp .gh .mv { flex: none; }
  .grp .gh .gc { flex: none; font-weight: 400; font-size: 11px; color: var(--muted); background: rgba(127,127,127,.18); border-radius: 10px; padding: 0 7px; white-space: nowrap; }
  .grp .gl { margin-top: 6px; padding-left: 4px; border-left: 2px solid rgba(127,127,127,.25); }
  .grp .gh .badge { display: inline; margin-left: 6px; font-weight: 400; }
  .subtog { display: inline-block; margin-top: 3px; padding: 0 6px; border: none; border-radius: 10px; background: rgba(127,127,127,.18);
            color: var(--muted); font-size: 11px; cursor: pointer; }
  .subtog:hover { color: var(--accent); }
  .sublist { margin: 4px 0 0; padding-left: 4px; border-left: 2px solid rgba(127,127,127,.25); }
  .sublist .sublist { margin-left: 10px; }
  .si { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; padding: 1px 0; cursor: default; }
  .si .sb { flex: none; width: 13px; text-align: center; color: var(--muted); }
  .si input[type=checkbox] { margin: 2px 0 0; }
  .si.done .st2 { text-decoration: line-through; color: var(--muted); }
  .si .st2 { flex: 1; min-width: 0; word-break: break-word; }
  .subload { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .del, .mv { border: none; background: none; color: var(--muted); padding: 0 4px; opacity: 0; display: inline-flex; align-items: center; justify-content: center; height: 20px; line-height: 1; flex: none; }
  .card:hover .del, .card:focus-within .del, .card:hover .mv, .card:focus-within .mv, .grp:hover .mv, .grp:focus-within .mv { opacity: 1; }
  @media (hover: none) { .del, .mv { opacity: 1; } }
  .mv:hover { color: var(--accent); }
  .del:hover { color: #de350b; }
  .card { position: relative; }
  .movepop { position: fixed; z-index: 80; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 8px; width: 250px; font-size: 13px; }
  .movepop .mq, .movepop .mr { display: flex; gap: 6px; }
  .movepop button { padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text); cursor: pointer; font: inherit; }
  .movepop .mq button { flex: 1; white-space: nowrap; padding: 5px 4px; }
  .movepop .mr input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .movepop .go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .movepop .cancel { color: var(--muted); }
  .add { display: block; width: 100%; padding: 7px 8px; border: 1px dashed var(--border); border-radius: 6px;
         background: transparent; color: var(--text); font: inherit; }
  .empty { color: var(--muted); font-size: 12px; padding: 2px 4px 8px; }

  /* Calendar */
  .calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .calhead button { padding: 2px 9px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .calgrid .dow { font-size: 11px; color: var(--muted); padding: 2px 0; }
  .calgrid .day { position: relative; border: none; background: transparent; padding: 5px 0; font-size: 12px; border-radius: 6px; }
  .calgrid .day:hover { background: var(--card); }
  .calgrid .day.other { color: var(--muted); opacity: .6; }
  .calgrid .day.inwin { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .calgrid .day.istoday { font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
  .calgrid .day i { position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
                    border-radius: 50%; background: var(--accent); }

  /* Outliner */
  /* Daily page: read from WorkFlowy, nested like the outline */
  /* Daily page fills the space left in the sidebar and scrolls inside itself. */
  #outliner { flex: 1 1 0; min-height: 300px; display: flex; flex-direction: column; }
  #outliner > h3, #outliner > #composer, #outliner > .cbar, #outliner > .outbar, #outliner > .viewbar { flex: none; }
  .pagetree { flex: 1 1 0; min-height: 60px; overflow-y: auto; scrollbar-width: thin; background: var(--card);
              border-radius: 6px; padding: 6px 8px; margin-bottom: 12px; font-size: 13px; }
  /* Expanded: the calendar and Past due / Upcoming panels hide, so the page (and the add pad) get the whole sidebar. */
  #side.expanded #cal, #side.expanded #extras { display: none; }
  .pl { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
  .pl .tg { flex: none; width: 20px; padding: 0; border: none; background: none; color: var(--text); opacity: .8; font-size: 17px; line-height: 1.15; text-align: center; }
  .pl button.tg { cursor: pointer; border-radius: 4px; }
  .pl button.tg:hover { color: var(--accent); opacity: 1; background: rgba(127,127,127,.18); }
  .pl .pc { color: var(--muted); font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .pl .b { flex: none; width: 13px; text-align: center; color: var(--muted); }
  .pl input[type=checkbox] { flex: none; margin: 2px 0 0; }
  .pl .t { flex: 1; min-width: 0; word-break: break-word; cursor: text; }
  .pl .pn { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .pl-edit { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .pl-edit textarea { width: 100%; box-sizing: border-box; resize: none; overflow: hidden; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--accent); border-radius: 4px; padding: 3px 5px; }
  .pl-edit .pe-note { font-size: 12px; border-color: var(--border); }
  .pl-edit .pe-note:focus { border-color: var(--accent); outline: none; }
  .pl-edit .pe-title:focus { outline: none; }
  .pl-edit .pe-hint { font-size: 10px; color: var(--muted); }
  #pageHead #pageMore { margin-left: 0; }
  .pop.fixed { position: fixed; right: auto; top: 0; left: 0; z-index: 85; width: 270px; }
  .pop button { display: flex; width: 100%; text-align: left; border: none; background: none; padding: 7px 8px; border-radius: 6px; font-size: 14px; }
  .pop button:hover { background: rgba(127,127,127,.14); }
  .pop button small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .cbar { display: flex; align-items: center; gap: 6px; width: 100%; margin: 0 0 6px; padding: 5px 8px; border: none; border-top: 1px solid var(--border); border-radius: 0; background: transparent; color: var(--text); font-size: 13px; text-align: left; cursor: pointer; }
  .cbar strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbar.away strong { color: var(--accent); }
  .cbar .car { font-size: 15px; line-height: 1; color: var(--muted); }
  .cbar .cdraft { font-size: 11px; color: #fff; background: var(--accent); border-radius: 10px; padding: 0 7px; }
  .cbar .cdraft[hidden] { display: none; }
  .cbar:hover .car { color: var(--accent); }
  #outliner.composer-closed #composer, #outliner.composer-closed #outSave, #outliner.composer-closed .osep { display: none; }
  #outliner.composer-closed .outright { margin-left: 0; }   /* no blank gap where Save was */
  .pl .addc, .pl .indc, .pl .delc { flex: none; border: none; background: none; color: var(--muted); padding: 0 4px; opacity: 0; }
  .pl .addc:hover, .pl .indc:hover { color: var(--accent); }
  .pl .delc:hover { color: #c0392b; }
  .pl:hover .addc, .pl:hover .indc, .pl:hover .delc, .pl:focus-within .addc, .pl:focus-within .indc, .pl:focus-within .delc { opacity: 1; }
  @media (hover: none) { .pl .addc, .pl .indc, .pl .delc { opacity: 1; } }
  .pl-add { padding: 2px 0 4px; }
  .pl-add input { width: 100%; font: inherit; padding: 3px 6px; border: 1px dashed var(--border);
                  border-radius: 4px; background: var(--card); color: var(--text); }
  .pl.done .t { text-decoration: line-through; color: var(--muted); }
  .pl.h .t { font-weight: 700; }
  #outline { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 8px; border-radius: 6px;
             border: 1px solid var(--border); background: var(--card); color: var(--text);
             font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; }
  /* Item view bar (shown when a search result is open in the page pane) */
  .viewbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px;
             color: var(--muted); margin: -2px 0 8px; }
  .viewbar[hidden] { display: none; }
  .viewbar button { padding: 2px 8px; font-size: 12px; }
  .viewbar a { color: var(--accent); text-decoration: none; }
  .viewbar a:hover { text-decoration: underline; }

  /* Search window */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex;
           align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
  .modal[hidden] { display: none; }
  .sm-list, .sm-item { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sm-list[hidden], .sm-item[hidden] { display: none; }
  .sm-item .viewbar { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sm-item .pagetree { flex: 1; min-height: 240px; padding: 8px 12px; }
  .modal-box { width: min(700px, 100%); max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
               background: var(--card); color: var(--text); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .sm-head { flex: none; display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .sm-head input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 6px;
                   border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .sm-filters { flex: none; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; font-size: 13px;
                border-bottom: 1px solid var(--border); }
  .sm-filters label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .sm-results { flex: 1; min-height: 120px; overflow-y: auto; }
  .sr-more { display: block; width: calc(100% - 24px); margin: 8px 12px; padding: 6px; }
  .sm-results .hint { padding: 16px 12px; color: var(--muted); font-size: 13px; }
  .sr { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .sr:hover, .sr.active { background: var(--col); }
  .sr .st { word-break: break-word; }
  .sr .sp { font-size: 11px; color: var(--muted); word-break: break-word; }
  .sr .st.done { color: var(--muted); text-decoration: line-through; }
  mark { background: #ffe27a; color: #000; border-radius: 2px; padding: 0 1px; }
  .sm-foot { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px;
             font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  .sm-foot .mini { padding: 2px 8px; }

  .ver a { color: #b45309; font-weight: 600; text-decoration: none; }
  .ver a:hover { text-decoration: underline; }
  .ver { flex: none; margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
  #foot { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 0 16px 10px; }
  #foot .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  #foot .tools button { padding: 4px 10px; font-size: 13px; }
  .outbar { flex-wrap: wrap; }
  .outbar { gap: 3px; }
  .outbar button { padding: 4px 5px; font-size: 12px; white-space: nowrap; }
  .osep { flex: none; align-self: stretch; width: 1px; margin: 2px 0; background: var(--border); }
  .outright { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .reports { position: relative; }
  #outStatus { flex: 1 0 100%; }
  #outStatus:empty { display: none; }
  .outbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }

  @media (max-width: 820px) {
    #main { flex-direction: column; overflow-y: auto; }
    #board { flex: none; height: 75vh; height: 75dvh; }
    #side { flex: none; width: 100%; overflow: visible; }
    #extras { flex: none; }
    #side .col { flex: none; max-height: 40vh; }
    #outliner { flex: none; min-height: 0; }
    .pagetree { flex: none; max-height: 60vh; }
    .modal { padding: 0; }
    .modal-box { width: 100%; max-height: none; height: 100vh; height: 100dvh; border-radius: 0; }
  }

  /* Header buttons */
  #planBtn.on, #selBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pop input[type=number] { flex: none; width: 58px; font: inherit; font-size: 13px; padding: 2px 4px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }

  /* Toast (undo) and the bulk-select bar */
  .toast { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 10px;
           max-width: min(560px, calc(100vw - 24px)); padding: 9px 12px; border-radius: 8px; background: #172b4d; color: #fff;
           box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 14px; }
  .toast[hidden], #selbar[hidden] { display: none; }
  .toast span { flex: 1; min-width: 0; word-break: break-word; }
  .toast button { padding: 3px 10px; background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .toast button:hover { border-color: #fff; }
  .toast #toastX { border: none; padding: 3px 6px; opacity: .7; }
  #selbar { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 8px;
            max-width: calc(100vw - 24px); padding: 9px 12px; border-radius: 10px; background: var(--card); color: var(--text);
            border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: 14px; }
  #selbar strong { margin-right: 4px; }
  #selDel:not(:disabled) { color: #de350b; }
  body.selmode .card { cursor: pointer; }
  body.selmode .card .txt { user-select: none; }

  .addhint { font-size: 11px; color: var(--accent); margin: 3px 4px 0; }

  /* Move-forward preview and the Done window */

  .roll-dest button, .sm-foot button { padding: 3px 9px; font-size: 13px; }
  .roll-dest .grow { flex: 1; }
  .rl { display: flex; gap: 8px; align-items: flex-start; padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }

  .rl .rd { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .rl input { margin-top: 3px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sm-head select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .dgrp { position: sticky; top: 0; padding: 6px 12px; font-size: 12px; font-weight: 700; background: var(--col); color: var(--muted); border-bottom: 1px solid var(--border); }
  .dr { display: flex; gap: 10px; align-items: flex-start; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }

  .dr a:hover { color: var(--accent); }

  /* Plan day */

  #plan[hidden], #board[hidden] { display: none; }

  .mbar { height: 8px; border-radius: 4px; background: rgba(127,127,127,.25); overflow: hidden; }
  .mbar div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .2s; }
